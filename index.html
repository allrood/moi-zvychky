/* ---------- синхронізація через Dropbox ---------- */
const DBX_APP_KEY = 'w6r9zuk8fksychq';   // ключ додатка Dropbox (App key); якщо порожній — вводиться в налаштуваннях
const DBX_FILE = '/habits-data.json';
const SYNC_CFG = 'habits-sync-cfg', SYNC_BASE = 'habits-sync-base';
let sync = (() => { try { return JSON.parse(localStorage.getItem(SYNC_CFG)) || {}; } catch (e) { return {}; } })();
let syncBusy = false, syncAgain = false, syncTimer = null;
const syncCfgSave = () => { try { localStorage.setItem(SYNC_CFG, JSON.stringify(sync)); } catch (e) {} };
const dbxKey = () => DBX_APP_KEY || sync.appKey || '';
const canon = o => JSON.stringify(o, (k,v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((a,x) => (a[x] = v[x], a), {}) : v);
const loadBase = () => { try { return JSON.parse(localStorage.getItem(SYNC_BASE)); } catch (e) { return null; } };
const saveBase = o => { try { localStorage.setItem(SYNC_BASE, JSON.stringify(o)); } catch (e) {} };
const FORM = {'Content-Type':'application/x-www-form-urlencoded'};
const form = o => new URLSearchParams(o).toString();
// у десктопі запити йдуть через головний процес (без обмежень CORS для file://)
async function xfetch(url, o){
  if (!(DESKTOP && DESKTOP.http)) return fetch(url, o);
  let r; try { r = await DESKTOP.http(url, o); } catch (e) { throw new Error('немає зв\'язку з Dropbox (' + String(e.message || e).replace(/^.*Error: /, '') + ')'); }
  return {ok:r.status >= 200 && r.status < 300, status:r.status, headers:{get:k => r.headers[k.toLowerCase()] ?? null}, text:async () => r.body, json:async () => JSON.parse(r.body)};
}
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

// тристороннє злиття: base — стан після останньої синхронізації, local — тут, remote — у Dropbox
function mergeState(base, local, remote){
  const B = base || {}, same = (a,b) => canon(a) === canon(b);
  const pick = (b,l,r) => same(l,r) ? l : same(l,b) ? r : same(r,b) ? l : (l && r && l.t && r.t && r.t > l.t ? r : l);
  const out = {version:2, settings:{}, notes:{}, entries:{}, habits:[]};
  const S = x => x.settings || {};
  new Set([...Object.keys(S(B)), ...Object.keys(S(local)), ...Object.keys(S(remote))]).forEach(k => {
    const v = k === 'dash' ? S(local)[k] : pick(S(B)[k], S(local)[k], S(remote)[k]); // вигляд головної — свій на кожному пристрої
    if (v !== undefined) out.settings[k] = v;
  });
  const hm = x => Object.fromEntries((x.habits || []).map(h => [h.id, h]));
  const hb = hm(B), hl = hm(local), hr = hm(remote), kept = {};
  new Set([...Object.keys(hb), ...Object.keys(hl), ...Object.keys(hr)]).forEach(id => { const v = pick(hb[id], hl[id], hr[id]); if (v) kept[id] = v; });
  const ord = x => (x.habits || []).map(h => h.id);
  const order = same(ord(local), ord(B)) ? ord(remote) : ord(local);
  [...order, ...ord(remote), ...ord(local)].forEach(id => { if (kept[id] && !out.habits.includes(kept[id])) out.habits.push(kept[id]); });
  const E = x => x.entries || {}, ek = new Set();
  [B, local, remote].forEach(x => { for (const d in E(x)) for (const id in E(x)[d]) ek.add(d + '|' + id); });
  ek.forEach(key => {
    const [d, id] = key.split('|'); if (!kept[id]) return;
    const g = x => E(x)[d] && E(x)[d][id];
    const v = pick(g(B), g(local), g(remote));
    if (v !== undefined) (out.entries[d] = out.entries[d] || {})[id] = v;
  });
  const nm = x => { const m = {}; for (const hid in (x.notes || {})) (x.notes[hid] || []).forEach(n => m[n.id] = {...n, _h:hid}); return m; };
  const nb = nm(B), nl = nm(local), nr = nm(remote);
  new Set([...Object.keys(nb), ...Object.keys(nl), ...Object.keys(nr)]).forEach(id => {
    const v = pick(nb[id], nl[id], nr[id]); if (!v || !kept[v._h]) return;
    const {_h, ...n} = v; (out.notes[_h] = out.notes[_h] || []).push(n);
  });
  return out;
}

// PKCE-пара готується заздалегідь: iPhone відкриває нове вікно лише одразу після натискання, без очікування
let pkce = null;
async function preparePkce(){
  try {
    const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
    pkce = {v, ch: b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)))};
  } catch (e) { pkce = null; }
}
function dbxStartAuth(){
  const ki = $('#dbxKey'); if (ki && ki.value.trim()) { sync.appKey = ki.value.trim(); }
  if (!dbxKey()) { toast('Встав App key з Dropbox'); return; }
  if (!pkce) { toast('Секунду, готую підключення… Натисни ще раз'); preparePkce(); return; }
  sync.verifier = pkce.v;
  sync.authUrl = `https://www.dropbox.com/oauth2/authorize?client_id=${encodeURIComponent(dbxKey())}&response_type=code&code_challenge=${pkce.ch}&code_challenge_method=S256&token_access_type=offline`;
  pkce = null; syncCfgSave();
  try { window.open(sync.authUrl, '_blank'); } catch (e) {}
  paintSync(); preparePkce();
}
async function dbxFinishAuth(){
  const code = ($('#dbxCodeInp') ? $('#dbxCodeInp').value : '').trim();
  if (!code) { toast('Встав код з Dropbox'); return; }
  try {
    const r = await xfetch('https://api.dropboxapi.com/oauth2/token', {method:'POST', headers:FORM, body:form({code, grant_type:'authorization_code', client_id:dbxKey(), code_verifier:sync.verifier})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.error || ('HTTP ' + r.status));
    sync.refresh = j.refresh_token; sync.access = j.access_token; sync.exp = Date.now() + ((j.expires_in || 14400) - 120) * 1000;
    delete sync.verifier; sync.err = null; syncCfgSave();
    toast('Dropbox підключено'); await syncNow(true);
  } catch (e) { toast('Не вдалося підключити: ' + (e.message || e)); }
}
async function dbxToken(){
  if (sync.access && Date.now() < sync.exp) return sync.access;
  const r = await xfetch('https://api.dropboxapi.com/oauth2/token', {method:'POST', headers:FORM, body:form({grant_type:'refresh_token', refresh_token:sync.refresh, client_id:dbxKey()})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { if (j.error === 'invalid_grant') { sync = {appKey:sync.appKey}; syncCfgSave(); throw new Error('доступ до Dropbox скасовано, підключи ще раз'); } throw new Error(j.error_description || j.error || ('HTTP ' + r.status)); }
  sync.access = j.access_token; sync.exp = Date.now() + ((j.expires_in || 14400) - 120) * 1000; syncCfgSave();
  return sync.access;
}
async function dbxDownload(){
  const r = await xfetch('https://content.dropboxapi.com/2/files/download', {method:'POST', headers:{Authorization:'Bearer ' + await dbxToken(), 'Dropbox-API-Arg':JSON.stringify({path:DBX_FILE})}});
  if (r.status === 409) { const t = await r.text(); if (t.includes('not_found')) return null; throw new Error(t.slice(0,200)); }
  if (!r.ok) throw new Error('Dropbox: HTTP ' + r.status);
  let rev = null; try { rev = JSON.parse(r.headers.get('Dropbox-API-Result')).rev; } catch (e) {}
  return {data: JSON.parse(await r.text()), rev};
}
async function dbxUpload(obj, rev){
  const mode = rev ? {'.tag':'update', update:rev} : 'overwrite';
  const r = await xfetch('https://content.dropboxapi.com/2/files/upload', {method:'POST', headers:{Authorization:'Bearer ' + await dbxToken(), 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg':JSON.stringify({path:DBX_FILE, mode, autorename:false, mute:true})}, body:JSON.stringify(obj)});
  if (r.status === 409) return {conflict:true};
  if (!r.ok) throw new Error('Dropbox: HTTP ' + r.status);
  return {rev:(await r.json()).rev};
}
function adopt(next){
  const d = migrate(JSON.parse(JSON.stringify(next))); if (!d) return;
  state = fixIcons(d); persist();
  if (draft) return; // не перемальовуємо під час редагування звички
  if (view === 'habit' && !state.habits.find(h => h.id === detailId)) view = prevView;
  render();
}
async function syncNow(manual){
  if (!sync.refresh || !dbxKey()) return;
  if (syncBusy) { syncAgain = true; return; }
  syncBusy = true; sync.status = 'busy'; paintSync();
  try {
    for (let attempt = 0; ; attempt++) {
      if (attempt > 3) throw new Error('файл постійно змінюється, спробуй ще раз');
      const remote = await dbxDownload();
      const base = loadBase(), localSnap = JSON.parse(JSON.stringify(state));
      let merged;
      if (!remote) merged = localSnap;
      else if (!base && !Object.keys(state.entries || {}).length) merged = remote.data; // новий пристрій — беремо все з Dropbox
      else merged = mergeState(base, localSnap, remote.data);
      if (!remote || canon(merged) !== canon(remote.data)) {
        const u = await dbxUpload(merged, remote && remote.rev);
        if (u.conflict) continue;
      }
      saveBase(merged);
      // якщо поки йшла синхронізація щось змінили тут — накладаємо ці зміни зверху
      const next = canon(state) !== canon(localSnap) ? mergeState(localSnap, state, merged) : merged;
      if (next !== merged) syncAgain = true;
      if (canon(next) !== canon(state)) adopt(next);
      break;
    }
    sync.last = Date.now(); sync.err = null; sync.status = 'ok';
    if (manual) toast('Синхронізовано ☁');
  } catch (e) {
    sync.status = 'err'; sync.err = e instanceof TypeError ? 'немає інтернету або Dropbox недоступний' : String(e.message || e);
    if (manual) toast('Синхронізація не вдалася: ' + sync.err);
  } finally {
    syncBusy = false; syncCfgSave(); paintSync();
    if (syncAgain) { syncAgain = false; scheduleSync(800); }
  }
}
function scheduleSync(ms){ if (!sync.refresh) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), ms || 2500); }
const hhmm = t => new Date(t).toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
function syncPanelBody(){
  if (sync.refresh) return `<div class="cap">Звички й записи зберігаються ще й у твоєму Dropbox (папка «Програми»), тож ПК і телефон бачать одне й те саме. Зміни відправляються одразу, а чужі підтягуються при відкритті програми.</div>
    <div class="row"><span>${sync.status === 'busy' ? '⏳ Синхронізую…' : sync.status === 'err' ? '⚠ Помилка: ' + esc(sync.err || '') : sync.last ? '✓ Остання синхронізація о ' + hhmm(sync.last) : 'Ще не синхронізовано'}</span><div class="spacer"></div>
    <button class="btn primary" data-act="dbxsync">Синхронізувати зараз</button><button class="btn" data-act="dbxoff">Відключити</button></div>
    <div class="row" style="margin-top:10px"><button class="btn" data-act="dbxlink">📱 Підключити інший пристрій</button></div>
    ${showLink ? `<div class="syncbox"><b>Код для телефона або іншого комп'ютера</b><ol><li>Скопіюй цей код і перешли його собі на телефон (наприклад, у «Збережене» в Telegram або в нотатки).</li><li>На телефоні відкрий «Звички» з іконки → «Налаштування» → «☁ Синхронізація», встав код у поле «Код з комп'ютера» і натисни «Підключити».</li></ol>
      <textarea class="inp" id="linkCode" rows="3" readonly style="font-family:monospace;font-size:12px;word-break:break-all">${esc(linkCode())}</textarea>
      <div class="row" style="margin-top:6px"><button class="btn primary" data-act="dbxcopy">Скопіювати код</button><button class="btn plain" data-act="dbxlinkhide">Сховати</button></div>
      <div class="hint" style="margin:6px 0 0">Код дає доступ лише до папки «Звичок» у твоєму Dropbox. Не пересилай його іншим людям.</div></div>` : ''}`;
  if (sync.verifier) return `<div class="syncbox"><b>Крок 2 з 2</b><ol><li>У вікні Dropbox натисни «Allow / Дозволити». Якщо вікно не відкрилося, натисни кнопку «Відкрити сторінку Dropbox» нижче.</li><li>Скопіюй код, який покаже Dropbox, і встав сюди.</li></ol>
    <div class="row"><input class="inp" id="dbxCodeInp" placeholder="Код з Dropbox" style="flex:1;min-width:180px"><button class="btn primary" data-act="dbxcode">Підключити</button></div>
    <div class="row" style="margin-top:6px"><a class="btn" href="${esc(sync.authUrl || '#')}" target="_blank" rel="noopener">Відкрити сторінку Dropbox</a><button class="btn plain" data-act="dbxcancel">Скасувати</button></div></div>`;
  return `<div class="cap">Щоб звички були однакові на ПК і на iPhone. Дані лежатимуть у твоєму Dropbox, у папці «Програми». Безкоштовно.</div>
    ${DBX_APP_KEY ? '' : `<label class="f">App key додатка Dropbox</label><input class="inp" id="dbxKey" value="${esc(sync.appKey || '')}" placeholder="напр. a1b2c3d4e5f6g7h" style="max-width:320px">`}
    <div class="row" style="margin-top:10px"><button class="btn primary" data-act="dbxauth">Підключити Dropbox</button></div>
    <div class="syncbox"><b>Уже підключив Dropbox на комп'ютері?</b><div class="hint" style="margin:4px 0 8px">На комп'ютері: «Налаштування» → «☁ Синхронізація» → «📱 Підключити інший пристрій» → «Скопіювати код». Встав його сюди.</div>
      <div class="row"><input class="inp" id="linkInp" placeholder="Код з комп'ютера (HZ1.…)" style="flex:1;min-width:180px"><button class="btn primary" data-act="dbxjoin">Підключити</button></div></div>`;
}
let showLink = false;
const linkCode = () => 'HZ1.' + b64url(new TextEncoder().encode(JSON.stringify({k:dbxKey(), r:sync.refresh})));
function joinByCode(){
  const raw = ($('#linkInp') ? $('#linkInp').value : '').replace(/\s+/g, '');
  try {
    if (!raw.startsWith('HZ1.')) throw 0;
    const b = atob(raw.slice(4).replace(/-/g,'+').replace(/_/g,'/'));
    const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))));
    if (!o.k || !o.r) throw 0;
    sync = {appKey:o.k, refresh:o.r}; syncCfgSave();
    toast('Підключаю…'); syncNow(true);
  } catch (e) { toast('Код не схожий на код з комп\'ютера. Скопіюй його ще раз повністю.'); }
}
function paintSync(){
  const p = $('#syncPill');
  if (p) {
    p.hidden = !sync.refresh;
    p.classList.toggle('err', sync.status === 'err');
    p.textContent = sync.status === 'busy' ? '☁ …' : sync.status === 'err' ? '☁ ⚠ помилка' : sync.last ? '☁ ' + hhmm(sync.last) : '☁';
    p.title = sync.status === 'err' ? 'Синхронізація не вдалася: ' + (sync.err || '') : 'Синхронізація з Dropbox';
  }
  const sp = $('#syncPanel');
  if (sp && !(sp.contains(document.activeElement) && document.activeElement.tagName === 'INPUT')) sp.innerHTML = '<h3>☁ Синхронізація через Dropbox</h3>' + syncPanelBody();
}
let lastAutoSync = 0;
function autoSync(){ if (sync.refresh && Date.now() - lastAutoSync > 20000) { lastAutoSync = Date.now(); syncNow(false); } }
window.addEventListener('focus', autoSync);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoSync(); });
setInterval(() => { if (document.visibilityState === 'visible') autoSync(); }, 5 * 60 * 1000);

/* ---------- оновлення (лише десктоп) ---------- */
const appVersion = () => (DESKTOP && DESKTOP.version ? DESKTOP.version() : '');
let updState = {checked:false, available:null, hidden:false, busy:false, lastCheck:0};
function updBox(){
  const u = updState.available;
  if (!u) return `<div class="updbox">✓ У тебе найновіша версія (${esc(appVersion())}). Файлів оновлення не знайдено.</div>`;
  return `<div class="updbox"><b>Доступна версія ${esc(u.version)}</b>${u.notes ? `<div class="notes" style="white-space:pre-line;color:var(--muted);font-size:12px;margin:6px 0">${esc(u.notes)}</div>` : ''}
    <div class="hint" style="margin:4px 0 8px">Файл: <code>${esc(u.path)}</code></div>
    <button class="btn primary" data-act="installupd">Встановити й перезапустити</button></div>`;
}
function showUpdPopup(){
  const u = updState.available, el = $('#upd');
  if (!u || updState.hidden || view === 'settings') { el.classList.add('hidden'); return; }
  el.innerHTML = `<h4>🔄 Доступна нова версія ${esc(u.version)}</h4>
    <div class="hint" style="margin:0">Зараз у тебе ${esc(appVersion())}. Дані не зачіпаються.</div>
    ${u.notes ? `<div class="notes">${esc(u.notes)}</div>` : '<div style="height:10px"></div>'}
    <div class="row"><button class="btn primary" data-act="installupd">Встановити й перезапустити</button><button class="btn plain" data-act="hideupd">Пізніше</button></div>`;
  el.classList.remove('hidden');
}
function paintSideFoot(){
  const f = $('#sideFoot'); if (!f) return;
  const v = appVersion();
  f.innerHTML = v ? `версія ${esc(v)}${updState.available ? ` · <b data-act="gosettings">є ${esc(updState.available.version)}</b>` : ''}` : '';
}
async function checkUpdate(manual){
  if (!DESKTOP || !DESKTOP.checkUpdate) return;
  try {
    const r = await DESKTOP.checkUpdate();
    const was = updState.available && updState.available.version;
    updState.checked = true; updState.available = r.available; updState.lastCheck = Date.now();
    if (r.available && r.available.version !== was) updState.hidden = false;
    paintSideFoot(); showUpdPopup();
    if (view === 'settings' && $('#updResult')) $('#updResult').innerHTML = updBox();
    if (manual && !r.available) toast('Оновлень не знайдено');
  } catch (e) { if (manual) toast('Не вдалося перевірити оновлення'); }
}
async function installUpdate(file){
  if (updState.busy) return; updState.busy = true;
  try {
    save();
    const r = await DESKTOP.installUpdate(file);
    if (r.ok) { toast(`Встановлюю версію ${r.version}, програма перезапуститься…`); $('#upd').classList.add('hidden'); }
    else if (!r.canceled) alert('Не вдалося встановити оновлення.\n\n' + r.error);
  } finally { updState.busy = false; }
}
window.addEventListener('focus', () => { if (Date.now() - updState.lastCheck > 15000) checkUpdate(false); });

/* ---------- події ---------- */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }

document.addEventListener('click', e => {
  if (pop && !e.target.closest('#pop') && !e.target.closest('[data-cell]')) closePop();
  const ex = e.target.closest('[data-expand]');
  if (ex && !e.target.closest('button')) { expanded = expanded === ex.dataset.expand ? null : ex.dataset.expand; render(); return; }
  const op = e.target.closest('[data-open]'); if (op) { openDetail(op.dataset.open); return; }
  if (e.target.closest('[data-gosync]')) { view = 'settings'; closePop(); render(); const sp = $('#syncPanel'); if (sp) sp.scrollIntoView({block:'center'}); return; }
  if (e.target.closest('[data-act="gosettings"]')) { view = 'settings'; closePop(); render(); return; }
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset, dk = dkey(curDate);
  if (d.view) { view = d.view; search = ''; closePop(); render(); return; }
  if (d.mode) { state.settings.dash = d.mode; save(); render(); return; }
  if (d.cal) { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +d.cal, 1); closePop(); render(); return; }
  if (d.dtab) { detailTab = d.dtab; render(); return; }
  if (d.gmode) { keepInputs(); draft.gmode = d.gmode; drawModal(); return; }
  if (d.gnext) { continueGoal(state.habits.find(x => x.id === detailId)); return; }
  if (d.gcustom) { const n = parseInt($('#gCustom').value, 10); if (!(n > 0)) { toast('Вкажи кількість днів'); return; } continueGoal(state.habits.find(x => x.id === detailId), n); return; }
  if (d.grestart) { const h = state.habits.find(x => x.id === detailId); if (confirm('Почати поточний етап заново з сьогоднішнього дня?')) { h.goal.start = todayKey(); save(); render(); } return; }
  if (d.goff) { const h = state.habits.find(x => x.id === detailId); if (confirm('Вимкнути інтервал для цієї звички? Записи залишаться.')) { delete h.goal; save(); render(); } return; }
  if (d.delnote) { if (confirm('Видалити нотатку?')) { state.notes[detailId] = (state.notes[detailId] || []).filter(n => n.id !== d.delnote); save(); render(); } return; }
  if (d.shift) { tableOff = d.shift === 'reset' ? 0 : Math.max(0, tableOff + +d.shift); render(); return; }
  if (d.cell) {
    const [id, k] = d.cell.split('|'), h = state.habits.find(x => x.id === id);
    if (h.measure === 'check') { const e0 = entry(k,id); setEntry(k, id, !e0 ? 1 : e0.v ? 0 : null); closePop(); render(); }
    else if (pop && pop.id === id && pop.k === k) closePop(); else openPop(b, id, k);
    return;
  }
  if (d.prate) { const e0 = entry(pop.k,pop.id); setEntry(pop.k, pop.id, e0 && e0.v === +d.prate ? null : +d.prate); closePop(); render(); return; }
  if (d.pok) { popSaveNum(); return; }
  if (d.pclear) { setEntry(pop.k, pop.id, null); closePop(); render(); return; }
  if (d.rate) { const e0 = entry(dk,d.id); setEntry(dk, d.id, e0 && e0.v === +d.rate ? null : +d.rate); render(); return; }
  if (d.check) { setEntry(dk, d.check, entry(dk,d.check) ? null : 1); render(); return; }
  if (d.skind) { keepInputs(); if (draft.skind !== d.skind) draft.sn = d.skind === 'every' ? 2 : 3; draft.skind = d.skind; drawModal(); return; }
  if (d.sday) { keepInputs(); const i = +d.sday; draft.sdays = draft.sdays.includes(i) ? draft.sdays.filter(x => x !== i) : [...draft.sdays, i]; drawModal(); return; }
  if (d.endadd) { keepInputs(); draft.end = dkey(addDays(parseKey(todayKey()), +d.endadd - 1)); drawModal(); return; }
  if (d.endclear) { keepInputs(); draft.end = ''; drawModal(); return; }
  if (d.finish) { finishHabit(d.finish); return; }
  if (d.restore) { restoreHabit(d.restore); return; }
  if (d.edit) { openHabit(d.edit); return; }
  if (d.del) { delHabit(d.del); return; }
  if (d.up) { const i = state.habits.findIndex(x => x.id === d.up); let j = i - 1; while (j >= 0 && finished(state.habits[j])) j--; if (j >= 0) { [state.habits[j], state.habits[i]] = [state.habits[i], state.habits[j]]; save(); render(); } return; }
  if (d.period) { period = d.period === 'all' ? 'all' : +d.period; render(); return; }
  if (d.tab) { chartTab = d.tab; render(); return; }
  if (d.sort) { sortBy = d.sort; render(); return; }
  if (d.week) { weekOff = Math.min(0, weekOff + +d.week); render(); return; }
  if (d.thr) { state.settings.threshold = +d.thr; save(); render(); return; }
  if (d.type) { keepInputs(); draft.type = d.type; drawModal(); return; }
  if (d.measure) { keepInputs(); draft.measure = d.measure; drawModal(); return; }
  if (d.dir) { keepInputs(); draft.dir = d.dir; drawModal(); return; }
  if (d.icon) { keepInputs(); draft.icon = d.icon; if ($('#fIcon')) $('#fIcon').value = ''; drawModal(); return; }
  if (d.cat) { keepInputs(); iconCat = +d.cat; drawModal(); return; }
  if (d.color) { keepInputs(); draft.color = d.color; drawModal(); return; }
  switch (d.act) {
    case 'prev': if (curDate > addDays(parseKey(todayKey()), -365)) curDate = addDays(curDate,-1); render(); break;
    case 'next': if (dkey(curDate) < todayKey()) curDate = addDays(curDate,1); render(); break;
    case 'today': curDate = parseKey(todayKey()); render(); break;
    case 'new': openHabit(null); break;
    case 'back': view = prevView; render(); break;
    case 'noteForm': noteForm = true; render(); break;
    case 'noteCancel': noteForm = false; render(); break;
    case 'noteSave': { const txt = $('#noteText').value.trim(); if (!txt) { toast('Напиши текст нотатки'); break; }
      (state.notes[detailId] = state.notes[detailId] || []).push({id:uid(), d:$('#noteDate').value || todayKey(), text:txt}); noteForm = false; save(); render(); toast('Нотатку збережено'); break; }
    case 'close': closeModal(); break;
    case 'saveHabit': saveHabit(); break;
    case 'export': exportData(); break;
    case 'openFolder': DESKTOP && DESKTOP.openFolder(); break;
    case 'checkupd': checkUpdate(true); break;
    case 'dbxauth': dbxStartAuth(); break;
    case 'dbxcode': dbxFinishAuth(); break;
    case 'dbxcancel': delete sync.verifier; syncCfgSave(); paintSync(); break;
    case 'dbxsync': syncNow(true); break;
    case 'dbxlink': showLink = true; paintSync(); break;
    case 'dbxlinkhide': showLink = false; paintSync(); break;
    case 'dbxjoin': joinByCode(); break;
    case 'dbxcopy': { const ta = $('#linkCode'); ta.select(); (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => toast('Код скопійовано'), () => { try { document.execCommand('copy'); toast('Код скопійовано'); } catch (e) { toast('Виділи код і скопіюй вручну'); } }); break; }
    case 'dbxoff': if (confirm('Відключити синхронізацію на цьому пристрої? Дані тут і в Dropbox залишаться.')) { sync = {}; syncCfgSave(); try { localStorage.removeItem(SYNC_BASE); } catch (e) {} paintSync(); toast('Синхронізацію вимкнено'); } break;
    case 'pickupd': installUpdate(null); break;
    case 'installupd': installUpdate(updState.available && updState.available.path); break;
    case 'hideupd': updState.hidden = true; showUpdPopup(); break;
    case 'reset': if (confirm('Видалити всі звички та записи? Це не можна скасувати.' + (sync.refresh ? ' Їх буде видалено і в Dropbox, і на інших пристроях.' : ''))) { state = {version:2, settings:{threshold:50}, notes:{}, habits:[], entries:{}}; save(); render(); toast('Дані видалено'); } break;
  }
});
document.addEventListener('change', e => {
  const n = e.target.dataset && e.target.dataset.num; if (!n) return;
  const raw = e.target.value.trim();
  setEntry(dkey(curDate), n, raw === '' ? null : Math.max(0, +raw));
  render();
});
document.addEventListener('keydown', e => {
  if (pop) { if (e.key === 'Escape') { closePop(); return; } if (e.key === 'Enter' && e.target.id === 'popNum') { popSaveNum(); return; } }
  if (e.target.dataset && e.target.dataset.num && e.key === 'Enter') { e.target.blur(); return; }
  if (!$('#modal').classList.contains('hidden')) {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') saveHabit();
  }
});
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });

render();
paintSideFoot();
checkUpdate(false);
paintSync(); autoSync(); preparePkce();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
