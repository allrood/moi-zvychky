<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Звички">
<meta name="theme-color" content="#2c303c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Мої звички</title>
<style>
  :root{
    --bg:#272b37; --side:#2c303c; --card:#323644; --card2:#3a3f4e; --border:#454a5a;
    --text:#e8eaf0; --muted:#9aa0b0; --accent:#a78bfa; --accent-d:#8b5cf6; --orange:#f5a524;
    --good:#4ade80; --bad:#f87171; --neu:#9aa0b0; --perfect:#22c55e; --partial:#f5a524; --missed:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  button,input,select{font:inherit;color:inherit}
  .top{position:fixed;top:0;left:0;right:0;height:50px;background:var(--side);display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #22252f;z-index:5}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
  .logo{width:26px;height:26px;border-radius:50%;background:#454a5a;display:grid;place-items:center;font-size:13px}
  .spacer{flex:1}
  .pill{background:#3a3e4b;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:-1px}
  .side{position:fixed;top:50px;bottom:0;left:0;width:170px;background:var(--side);padding:10px 6px}
  .nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;margin-bottom:2px}
  .nav:hover{background:#353946}
  .nav.active{background:#3d4150;box-shadow:inset 3px 0 0 var(--accent)}
  .nav svg{width:15px;height:15px;fill:currentColor;opacity:.9}
  main{margin-left:170px;padding:66px 24px 40px;max-width:1340px}
  h1{font-size:26px;margin:0}
  h2{font-size:16px;margin:16px 0 4px}
  .hint{color:var(--muted);font-size:12px;margin-bottom:10px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .date{font-weight:600;min-width:200px;text-align:center}
  .search,.sel-in{background:#323644;border:1px solid var(--border);border-radius:6px;color:var(--text);padding:7px 10px}
  .search{width:220px}
  .btn{background:#3e4352;border:0;padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:600}
  .btn:hover{background:#474c5d}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.primary{background:var(--accent);color:#1d1b2e}
  .btn.primary:hover{background:#b9a2fc}
  .btn.danger{background:#5a2e36;color:#ffb4bf}
  .seg{display:inline-flex;background:#323644;border-radius:8px;padding:3px;gap:2px}
  .seg button{background:none;border:0;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
  .seg button.on{background:var(--accent);color:#1d1b2e}
  .seg.soft button.on{background:#454a5a;color:var(--text)}

  /* картки звичок */
  .card{background:var(--card);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none}
  .info{flex:1;min-width:0}
  .title{font-weight:600}
  .note{color:var(--muted);font-style:italic;font-size:12px}
  .sub{font-size:12.5px;margin-top:2px;color:#cfd3dc}
  .mini{height:4px;background:#3a3f4e;border-radius:9px;margin-top:6px;max-width:320px;overflow:hidden}
  .mini i{display:block;height:100%;border-radius:9px}
  .type{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font-size:12px;font-weight:700;margin-left:6px;background:#3a3f4e;vertical-align:1px}
  .t-good{color:var(--good)} .t-bad{color:var(--bad)} .t-neu{color:var(--neu)}
  .warn{color:var(--orange);font-weight:600}
  .rate{display:flex;gap:4px}
  .rate button{width:32px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--card2);cursor:pointer;font-weight:600}
  .rate button:hover{border-color:var(--accent)}
  .rate button.fill{background:rgba(167,139,250,.22);border-color:rgba(167,139,250,.45)}
  .rate button.on{background:var(--accent);border-color:var(--accent);color:#1d1b2e}
  .done{background:#3e4352;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;min-width:104px}
  .done.on{background:var(--accent);color:#1d1b2e}
  .numbox{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
  .numinp{width:96px;background:#272b37;border:1px solid var(--border);border-radius:6px;padding:6px 8px;text-align:right;color:var(--text)}
  .numinp:focus{outline:none;border-color:var(--accent)}
  .ring{flex:none}
  .kebab{background:none;border:0;cursor:pointer;font-size:18px;padding:2px 6px;color:var(--muted);border-radius:4px}
  .kebab:hover{background:#3a3f4e;color:var(--text)}
  .daysum{background:var(--card);border-radius:10px;padding:10px 12px;margin:10px 0 0;display:flex;align-items:center;gap:12px}
  .bar{flex:1;height:8px;background:#3a3f4e;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent));border-radius:99px}

  /* прогрес */
  .panel{background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:12px}
  .panel h3{margin:0;font-size:14.5px}
  .panel .cap{color:var(--muted);font-size:12px;margin:2px 0 10px}
  .hero{background:linear-gradient(160deg,#3a3650 0%,#323644 45%)}
  .big{font-size:30px;font-weight:700;line-height:1}
  svg.chart{width:100%;height:auto;display:block}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
  .tile{background:var(--card);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start}
  .tile .ti{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex:none}
  .tile b{display:block;font-size:22px;line-height:1.1}
  .tile .l{font-weight:600;font-size:12.5px}
  .tile .s{color:var(--muted);font-size:11.5px}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
  .three .panel{margin:0}
  .wk{display:flex;justify-content:space-between;gap:8px;height:120px;align-items:flex-end}
  .wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
  .wk .val{font-size:11px;color:var(--muted);height:14px}
  .wk .track{flex:1;width:100%;max-width:30px;background:#3a3f4e;border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
  .wk .track i{display:block;width:100%;background:var(--accent);border-radius:6px}
  .wk .d{font-size:12px;font-weight:600}
  .stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#3a3f4e;margin:6px 0 12px}
  .legrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
  .legrow .sq{width:9px;height:9px;border-radius:2px}
  .legrow b{margin-left:auto}
  .review{display:grid;grid-template-columns:200px repeat(7,1fr) 70px;gap:6px;align-items:center}
  .review .h{color:var(--muted);font-size:11.5px;text-align:center}
  .review .c{height:30px;border-radius:6px;background:#3a3f4e;display:grid;place-items:center;font-size:11.5px;font-weight:600}
  .review .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
  .review .nm .icon{width:24px;height:24px;font-size:12px}
  .year{overflow-x:auto}
  .legend{display:flex;justify-content:flex-end;align-items:center;gap:4px;color:var(--muted);font-size:11px;margin-top:6px}
  .legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
  .htable .hr{display:grid;grid-template-columns:200px 1fr 90px 120px 70px 30px;gap:12px;align-items:center;padding:10px 6px;border-top:1px solid #3b4050;cursor:pointer;border-radius:6px}
  .htable .hr:hover{background:#383c4a}
  .htable .hr.head{color:var(--muted);font-size:12px;cursor:default;border-top:0;padding-top:0}
  .htable .hr.head:hover{background:none}
  .hname{display:flex;align-items:center;gap:8px;font-weight:600}
  .hname .icon{width:26px;height:26px;font-size:13px}
  .rbar{display:flex;align-items:center;gap:10px}
  .rbar .bar{height:6px}
  .up{color:var(--good)} .down{color:var(--bad)}
  .expand{padding:4px 6px 12px}
  .ttable{background:var(--card);border-radius:12px;padding:6px 6px 4px;margin-top:10px;overflow-x:auto}
  .ttable .tr{display:grid;grid-template-columns:minmax(280px,1fr) repeat(var(--n),60px);align-items:center;border-top:1px solid #3b4050;min-width:880px}
  .ttable .thead,.ttable .tr:nth-child(2){border-top:0}
  .tname{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;border-radius:8px;min-width:0}
  .tname:hover{background:#383c4a}
  .tname .icon{width:28px;height:28px;font-size:13px}
  .tname .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tname .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tname .ring{margin:-4px -4px -4px -6px}
  .tname.muted{color:var(--muted);font-size:12px;cursor:default}
  .tname.muted:hover{background:none}
  .tnav{display:flex;gap:6px;padding:6px 10px}
  .tnav .btn{padding:5px 10px;font-size:12px}
  .th{text-align:center;font-size:12px;font-weight:700;line-height:1.25;padding:6px 0}
  .th span{font-weight:500;color:var(--muted)}
  .th.today{color:var(--accent)} .th.today span{color:var(--accent)}
  .td{height:40px;margin:3px 4px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-weight:700;font-size:13px}
  .td:hover{outline:1px solid var(--accent)}
  .td.ok{font-size:19px}
  .td.no{color:#7c8293;font-size:15px}
  .td.q{color:#626879;font-size:16px;font-weight:500}
  .td.off{color:#4a4f5f;font-size:14px}
  .cd.off{color:#5d6373}
  .dows{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .dw{min-width:44px;padding:7px 0;border:1px solid var(--border);border-radius:8px;background:#2d3140;cursor:pointer;font-weight:600}
  .dw.sel{border-color:var(--accent);background:#3a3550;color:var(--accent)}
  .fbanner{display:flex;align-items:center;gap:10px;background:var(--card);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin:10px 0 0}
  .panel.fin{border:1px solid var(--accent)}
  .card.finished{opacity:.85}
  .tf{text-align:center;font-size:11.5px;color:var(--muted);font-weight:600;padding:8px 0}
  .pop{position:absolute;z-index:25;background:#3a3f4e;border:1px solid var(--border);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px;min-width:220px}
  .pop .ptitle{font-size:12px;color:var(--muted);font-weight:600}
  .pop .numinp{width:110px}
  .btn.plain{background:none;color:var(--muted);font-weight:500;padding:2px 0;text-align:left}
  .btn.plain:hover{color:var(--text);background:none}
  .goal .stages{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
  .stage{padding:4px 10px;border-radius:99px;background:#3a3f4e;font-size:12px;font-weight:600;border:1px solid transparent;color:var(--muted)}
  .stage.done{color:var(--good)}
  .stage.cur{color:var(--text);background:#3a3550}
  .arrow{color:var(--muted);font-size:12px}
  .gboxes{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
  .gboxes i{width:16px;height:16px;border-radius:4px;background:#3a3f4e;display:block}
  .gdone{background:#1f3b2b;color:#bbf7d0;padding:8px 12px;border-radius:8px;font-weight:600;margin-top:6px}
  .ghist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .ghist span{font-size:11.5px;color:var(--muted);background:#2d3140;padding:3px 8px;border-radius:6px}
  .clickable{cursor:pointer}
  .title.clickable:hover{text-decoration:underline}
  .detail{max-width:1060px;margin:0 auto}
  .dhead{display:flex;align-items:center;gap:16px;margin-top:8px}
  .icon.big{width:56px;height:56px;border-radius:14px}
  .icon.sm{width:24px;height:24px;border-radius:6px;display:inline-grid;vertical-align:middle;margin-right:6px}
  .dname{font-size:24px;font-weight:700}
  .dtiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
  .dtile{background:var(--card);border-radius:10px;padding:10px 12px}
  .dtile.acc{background:#383450}
  .dtile .dl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
  .dtile b{font-size:22px}
  .dtile span{color:var(--muted);font-size:12px}
  .dgrid{display:grid;grid-template-columns:1fr 1.25fr;gap:12px;margin-bottom:12px}
  .dgrid .panel{margin:0}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
  .cdh{text-align:center;font-size:11px;color:var(--muted);font-weight:600}
  .cd{height:40px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:600;position:relative}
  .cd:hover{outline:1px solid var(--accent)}
  .cd.today{outline:2px solid var(--accent)}
  .cd.dark{color:#1d1b2e}
  .cd.future{display:grid;place-items:center;color:#5d6373;cursor:default}
  .cd.future:hover{outline:0}
  .cd i{position:absolute;right:5px;top:2px;font-style:normal;font-size:10px;color:#9aa0b0}
  .noteform{display:grid;gap:8px;margin:10px 0}
  .noteitem{display:grid;grid-template-columns:150px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid #3b4050;align-items:start}
  .noteitem .nd{color:var(--muted);font-size:12px;font-weight:600}
  @media (max-width:1050px){.dtiles{grid-template-columns:repeat(3,1fr)}.dgrid{grid-template-columns:1fr}}
  .empty{color:var(--muted);padding:30px;text-align:center;background:var(--card);border-radius:10px}

  /* модальне */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20}
  .hidden{display:none}
  .dialog{background:var(--card);border-radius:12px;padding:18px 20px;width:540px;max-height:92vh;overflow:auto}
  .dialog h3{margin:0 0 12px}
  label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .inp{width:100%;background:#272b37;border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 10px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opts{display:grid;gap:6px}
  .opts.h3c{grid-template-columns:repeat(3,1fr)}
  .topt{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:#2d3140;text-align:left}
  .topt.sel{border-color:var(--accent);background:#3a3550}
  .topt .type{margin:0;width:24px;height:24px;font-size:15px}
  .topt small{display:block;color:var(--muted);font-size:11.5px}
  .grid{display:flex;flex-wrap:wrap;gap:5px}
  .ic{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:#2d3140;cursor:pointer;font-size:16px}
  .ic.sel{border-color:var(--accent);background:#3a3550}
  .icon svg{width:50%;height:50%;fill:#fff}
  .ic svg{width:16px;height:16px;fill:#e8eaf0}
  .ic.sel svg{fill:#fff}
  .iconhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
  .icon.prev{width:44px;height:44px}
  .catseg{flex-wrap:wrap}
  .catseg button{font-size:11.5px;padding:4px 8px}
  .icgrid .ic{display:grid;place-items:center}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .sw.sel{border-color:#fff}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#454a5a;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  #toast.show{opacity:1}
  .sidefoot{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted)}
  .sidefoot b{color:var(--accent);font-weight:600;cursor:pointer}
  #upd{position:fixed;right:18px;bottom:18px;width:360px;background:var(--card2);border:1px solid var(--accent);border-radius:12px;padding:14px 16px;z-index:25;box-shadow:0 8px 30px #0006}
  #upd h4{margin:0 0 4px;font-size:14px}
  #upd .notes{white-space:pre-line;color:var(--muted);font-size:12px;margin:6px 0 10px;max-height:160px;overflow:auto}
  .updbox{background:#2d3140;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:10px}
  @media (max-width:1050px){.tiles{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.htable .hr{grid-template-columns:150px 1fr 70px 100px 50px 20px}}
  .pill.sync{cursor:pointer}
  .pill.sync.err{background:#5a2e36;color:#ffb4bf}
  a.btn{text-decoration:none;display:inline-block;color:var(--text)}
  .syncbox{background:#2d3140;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:10px}
  .syncbox ol{margin:6px 0 8px 18px;padding:0;color:var(--muted);font-size:12.5px}
  @media (max-width:700px){
    input,select,textarea{font-size:16px !important}
    .top{height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0}
    .brand{font-size:14px}
    #todayPill{display:none}
    .side{top:auto;bottom:0;right:0;width:auto;height:calc(58px + env(safe-area-inset-bottom));padding:4px 4px env(safe-area-inset-bottom);display:flex;gap:2px;border-top:1px solid #22252f;z-index:6}
    .nav{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 2px;margin:0;justify-content:center;text-align:center}
    .nav.active{box-shadow:inset 0 3px 0 var(--accent)}
    .nav svg{width:18px;height:18px}
    .sidefoot{display:none}
    main{margin-left:0;padding:calc(60px + env(safe-area-inset-top)) 10px calc(84px + env(safe-area-inset-bottom))}
    .search{width:100%}
    .ttable{padding:4px 2px}
    .ttable .tr{grid-template-columns:minmax(0,1fr) repeat(var(--n),40px);min-width:0}
    .tname{padding:6px 4px;gap:6px}
    .tname .ring{display:none}
    .tname .icon{width:24px;height:24px}
    .td{height:36px;margin:2px 1px}
    .td.ok{font-size:16px}
    .th{font-size:11px}
    .tnav{padding:4px;gap:4px;flex-direction:column;align-items:flex-start}
    .tnav .btn{padding:3px 6px;font-size:11px}
    .card{flex-wrap:wrap;gap:8px}
    .card .ring{display:none}
    .card .info{flex-basis:60%}
    .tiles{grid-template-columns:1fr 1fr;gap:8px}
    .dtiles{grid-template-columns:repeat(2,1fr);gap:8px}
    .dhead{flex-wrap:wrap;gap:10px}
    .dname{font-size:19px}
    .panel{padding:12px}
    .review{grid-template-columns:76px repeat(7,1fr) 38px;gap:3px}
    .review .nm{font-size:10.5px;gap:4px}
    .review .nm .icon{display:none}
    .review .c{font-size:9px;height:26px}
    .htable .hr{grid-template-columns:1.2fr 1fr 80px;gap:8px}
    .htable .hr > :nth-child(3),.htable .hr > :nth-child(5),.htable .hr > :nth-child(6){display:none}
    .overlay{align-items:flex-end}
    .dialog{width:100%;max-height:92vh;border-radius:14px 14px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
    .opts.h3c,.opts.o4{grid-template-columns:1fr 1fr !important}
    .noteitem{grid-template-columns:1fr auto}
    .noteitem .nd{grid-column:1/-1}

const dkey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayKey = () => dkey(new Date());
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short = k => { const d = parseKey(k); return pad(d.getDate())+'.'+pad(d.getMonth()+1); };
const dow = k => (parseKey(k).getDay()+6) % 7; // 0 = понеділок
const fmt = n => Number(n).toLocaleString('uk-UA');
const avg = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : null;
const daysBetween = (a,b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const longDate = k => parseKey(k).toLocaleDateString('uk-UA',{day:'numeric', month:'long', year:'numeric'});

/* ---------- зберігання ---------- */
function seed(){
  const t = todayKey();
  return { version:2, settings:{threshold:50}, notes:{}, entries:{}, habits:[
    {id:uid(), name:'Сон', note:'Засинати до 00:00', icon:'fa:bed', color:'#a855f7', type:'good', measure:'check', created:t},
    {id:uid(), name:'Моб ігри', note:'відмова', icon:'fa:phone-slash', color:'#ef4444', type:'bad', measure:'check', created:t},
    {id:uid(), name:'Читання', note:'', icon:'fa:book', color:'#22c55e', type:'good', measure:'rating', created:t},
    {id:uid(), name:'Активність', note:'', icon:'fa:shoe-prints', color:'#14b8a6', type:'good', measure:'number', target:5000, unit:'кроків', dir:'min', created:t},
    {id:uid(), name:'Anki', note:'', icon:'fa:star', color:'#f97316', type:'good', measure:'number', target:100, unit:'карток', dir:'min', created:t}
  ]};
}
function migrate(d){
  if (d && d.version === 2) { d.settings = d.settings || {threshold:50}; d.notes = d.notes || {}; return d; }
  if (d && Array.isArray(d.habits) && d.scores) { // формат першої версії
    const entries = {};
    for (const k in d.scores) { entries[k] = {}; for (const id in d.scores[k]) entries[k][id] = {v:d.scores[k][id]}; }
    return { version:2, settings:{threshold:50}, notes:{}, entries, habits:d.habits.map(h => ({...h, measure:'rating'})) };
  }
  return null;
}
function fixIcons(d){ d.habits.forEach(h => { if (EMOJI_MAP[h.icon]) h.icon = 'fa:' + EMOJI_MAP[h.icon]; }); return d; }
function load(){ return fixIcons(loadRaw()); }
const DESKTOP = window.desktop || null; // є лише в десктопній версії
function loadRaw(){
  try {
    if (DESKTOP) { const raw = DESKTOP.load(); return raw ? (migrate(JSON.parse(raw)) || seed()) : seed(); }
    const raw = localStorage.getItem(KEY);
    if (raw) return migrate(JSON.parse(raw)) || seed();
    const old = localStorage.getItem(OLD_KEY);
    if (old) { const m = migrate(JSON.parse(old)); if (m) return m; }
  } catch(e) {}
  return seed();
}
function save(){ persist(); scheduleSync(); }
function persist(){
  try {
    if (DESKTOP) { if (!DESKTOP.save(JSON.stringify(state))) throw 0; }
    else localStorage.setItem(KEY, JSON.stringify(state));
  } catch(e) { toast('Не вдалося зберегти дані'); }
}

let state = load();
let view = 'dashboard', curDate = parseKey(todayKey()), search = '';
let lastView = null, prevView = 'dashboard', detailId = null, calMonth = null, detailTab = 'days', noteForm = false;
let tableOff = 0, period = 30, filter = 'all', chartTab = 'rate', weekOff = 0, sortBy = 'rate', expanded = null;

/* ---------- розрахунки ---------- */
const entry = (k,id) => state.entries[k] && state.entries[k][id];
function pctOf(h, e){
  if (!e) return null;
  if (h.measure === 'check') return e.v ? 100 : 0;
  if (h.measure === 'rating') return Math.round(e.v * 20);
  const T = +h.target || 0, v = +e.v;
  if (h.dir === 'max') { if (v <= T) return 100; return T ? Math.max(0, Math.round(100 - (v-T)/T*100)) : 0; }
  return T ? Math.min(100, Math.round(v / T * 100)) : 100;
}
const pct = (h,k) => pctOf(h, entry(k,h.id));
const P = (h,k) => pct(h,k) ?? 0;
const thr = () => state.settings.threshold || 50;

function setEntry(k, id, v){
  state.entries[k] = state.entries[k] || {};
  if (v === null) delete state.entries[k][id];
  else state.entries[k][id] = k === todayKey() ? {v, t:Date.now()} : {v};
  if (!Object.keys(state.entries[k]).length) delete state.entries[k];
  save();
}
function startOf(h){
  let s = h.created;
  for (const k in state.entries) if (state.entries[k][h.id] && k < s) s = k;
  return s;
}
/* розклад і кінцева дата */
const skind = h => (h.sched && h.sched.kind) || 'daily';
const isWeekly = h => skind(h) === 'weekly';
function isDue(h, k){
  const s = h.sched;
  if (!s || s.kind === 'daily' || s.kind === 'weekly') return true;
  if (s.kind === 'days') return s.days.includes(dow(k));
  if (s.kind === 'every') { const n = s.n || 1; return ((daysBetween(s.from || h.created, k) % n) + n) % n === 0; }
  return true;
}
const finished = h => !!(h.closed || (h.end && h.end < todayKey()));
const activeHabits = () => state.habits.filter(h => !finished(h));
const lastDay = h => h.end && h.end < todayKey() ? h.end : todayKey();
const inLife = (h, k) => k >= startOf(h) && (!h.end || k <= h.end);
// чи показувати день у графіках / історії
const shown = (h, k) => inLife(h,k) && (!!entry(k,h.id) || (!isWeekly(h) && isDue(h,k) && k < todayKey()));
const weekStart = k => dkey(addDays(parseKey(k), -dow(k)));
function weekDone(h, k){ // скільки днів зараховано в тижні, де лежить k
  const ws = parseKey(weekStart(k)); let n = 0;
  for (let i = 0; i < 7; i++) { const kk = dkey(addDays(ws, i)); if (inLife(h,kk) && P(h,kk) >= thr()) n++; }
  return n;
}
// чи чекає звичка відмітки цього дня (для «сьогодні»)
const dueOn = (h, k) => inLife(h,k) && (isWeekly(h) ? (!!entry(k,h.id) || weekDone(h,k) < h.sched.n) : isDue(h,k));
function schedText(h){
  const s = h.sched, k = skind(h);
  if (k === 'days') return s.days.length === 7 ? 'Щодня' : s.days.slice().sort().map(i => DOW[i]).join(', ');
  if (k === 'weekly') return `${s.n} р. на тиждень`;
  if (k === 'every') return s.n === 2 ? 'Через день' : `Кожні ${s.n} дн.`;
  return 'Щодня';
}
const fullDate = k => short(k) + '.' + parseKey(k).getFullYear();
function endText(h){
  if (!h.end) return '';
  if (finished(h)) return `🏁 завершено ${fullDate(h.end)}`;
  const left = daysBetween(todayKey(), h.end) + 1;
  return `до ${fullDate(h.end)} (ще ${left} дн.)`;
}
const sUnit = h => isWeekly(h) ? 'тиж.' : 'дн.';
function earliest(){ return state.habits.reduce((a,h) => { const s = startOf(h); return s < a ? s : a; }, todayKey()); }
function rangeKeys(fromKey, toKey){
  const out = []; let d = parseKey(fromKey);
  while (dkey(d) <= toKey) { out.push(dkey(d)); d = addDays(d,1); }
  return out;
}
function periodKeys(days){
  const t = todayKey();
  if (days === 'all') return rangeKeys(earliest(), t);
  return rangeKeys(dkey(addDays(parseKey(t), -(days-1))), t);
}
const selHabits = () => filter === 'all' ? state.habits : state.habits.filter(h => h.id === filter);

// які звички «заплановані» на день: від старту звички; сьогодні — тільки після першої відмітки
function dayHabits(k, hs){
  const list = hs.filter(h => inLife(h,k) && (isWeekly(h) ? !!entry(k,h.id) : isDue(h,k)));
  if (k === todayKey() && !list.some(h => entry(k,h.id))) return [];
  return list;
}
function dayRate(k, hs){ const l = dayHabits(k,hs); return l.length ? avg(l.map(h => P(h,k))) : null; }
function dayStatus(k, hs){
  const l = dayHabits(k,hs); if (!l.length) return null;
  const ps = l.map(h => P(h,k));
  if (ps.every(p => p >= 100)) return 'perfect';
  if (ps.every(p => p === 0)) return 'missed';
  return 'partial';
}
function counted(h, keys){
  const t = todayKey();
  return keys.filter(k => inLife(h,k) && (isWeekly(h) ? !!entry(k,h.id) : ((isDue(h,k) && k < t) || !!entry(k,h.id))));
}
// відсотки днів, що йдуть у статистику; для «N разів на тиждень» — N найкращих днів кожного тижня
function scored(h, keys){
  if (!isWeekly(h)) return counted(h,keys).map(k => P(h,k));
  const N = h.sched.n, t = todayKey(), weeks = {}, out = [];
  keys.forEach(k => { if (inLife(h,k) && k <= t) (weeks[weekStart(k)] = weeks[weekStart(k)] || []).push(k); });
  for (const ws in weeks) {
    const ks = weeks[ws], vals = ks.filter(k => entry(k,h.id)).map(k => P(h,k)).sort((a,b) => b-a);
    const last = dkey(addDays(parseKey(ws),6)), over = last < t || finished(h);
    const need = over ? Math.min(N, Math.ceil(N * ks.length / 7)) : 0;
    const top = vals.slice(0, N);
    while (top.length < need) top.push(0);
    out.push(...top);
  }
  return out;
}
function habitRate(h, keys){ const v = scored(h,keys); return v.length ? avg(v) : null; }
function streak(h){
  if (isWeekly(h)) return weekStreaks(h).cur;
  const s = startOf(h), t = todayKey(); let n = 0;
  for (let d = parseKey(lastDay(h)); dkey(d) >= s; d = addDays(d,-1)) {
    const k = dkey(d);
    if (P(h,k) >= thr()) { n++; continue; }
    if (k === t || !isDue(h,k)) continue; // вихідний за розкладом серію не рве
    break;
  }
  return n;
}
function bestStreak(h){
  if (isWeekly(h)) return weekStreaks(h).best;
  let best = 0, cur = 0; const t = todayKey();
  for (const k of rangeKeys(startOf(h), lastDay(h))) { if (P(h,k) >= thr()) { cur++; best = Math.max(best,cur); } else if (isDue(h,k) && k !== t) cur = 0; }
  return best;
}
function weekStreaks(h){ // серія тижнів, у які виконано норму
  const N = h.sched.n, t = todayKey(), end = lastDay(h);
  let best = 0, cur = 0;
  for (let ws = weekStart(startOf(h)); ws <= end; ws = dkey(addDays(parseKey(ws),7))) {
    const ok = weekDone(h, ws) >= N, open = dkey(addDays(parseKey(ws),6)) >= t && !finished(h);
    if (ok) { cur++; best = Math.max(best,cur); } else if (!open) cur = 0;
  }
  return {cur, best};
}
function perfectStreaks(hs){
  const keys = rangeKeys(earliest(), todayKey());
  let best = 0, cur = 0;
  for (const k of keys) { const st = dayStatus(k,hs); if (st === 'perfect') { cur++; best = Math.max(best,cur); } else if (st && k !== todayKey()) cur = 0; }
  return {cur, best};
}

/* ---------- графіки ---------- */
function xLabels(keys, x, H){
  const step = Math.max(1, Math.ceil(keys.length/8));
  return keys.map((k,i) => {
    if (keys.length > 120) { const d = parseKey(k); return d.getDate() === 1 ? `<text x="${x(i)}" y="${H-6}" fill="#9aa0b0" font-size="11" text-anchor="middle">${MON[d.getMonth()]}</text>` : ''; }
    return (i % step === 0) ? `<text x="${x(i)}" y="${H-6}" fill="#9aa0b0" font-size="11" text-anchor="middle">${short(k)}</text>` : '';
  }).join('');
}
function bigChart(keys, hs){
  const W = 1000, H = 230, L = 38, R = 10, T = 14, B = 26;
  const n = keys.length, iw = W-L-R;
  const x = i => L + (n < 2 ? iw/2 : i * iw / (n-1));
  const y = v => T + (1 - v/100) * (H-T-B);
  const grid = [0,50,100].map(g => `<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="#454a5a" stroke-dasharray="3 4"/><text x="${L-6}" y="${y(g)+4}" fill="#9aa0b0" font-size="11" text-anchor="end">${g}%</text>`).join('');
  let body = '';
  if (chartTab === 'rate') {
    const vals = keys.map(k => dayRate(k,hs));
    const segs = []; let cur = [];
    vals.forEach((v,i) => { if (v === null) { if (cur.length) segs.push(cur); cur = []; } else cur.push([x(i), y(v), i]); });
    if (cur.length) segs.push(cur);
    body = segs.map(s => {
      const line = s.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
      const area = `M${s[0][0]},${y(0)} L${line} L${s[s.length-1][0]},${y(0)} Z`;
      return `<path d="${area}" fill="url(#g)"/><path d="M${line}" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linejoin="round"/>`;
    }).join('') + (n <= 31 ? vals.map((v,i) => v === null ? '' : `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#a78bfa"><title>${short(keys[i])}: ${Math.round(v)}%</title></circle>`).join('') : '');
  } else {
    const bw = Math.max(1.5, Math.min(22, iw / n * 0.7));
    body = keys.map((k,i) => {
      const l = dayHabits(k,hs); if (!l.length) return '';
      let v, col, tip;
      if (chartTab === 'checkins') { const c = l.filter(h => entry(k,h.id)).length; v = c / l.length * 100; col = '#a78bfa'; tip = `${c} з ${l.length}`; }
      else { const s = dayStatus(k,hs); v = s === 'perfect' ? 100 : s === 'partial' ? dayRate(k,hs) : 4; col = s === 'perfect' ? '#22c55e' : s === 'partial' ? '#f5a524' : '#ef4444'; tip = {perfect:'Ідеальний день', partial:'Частково', missed:'Пропуск'}[s]; }
      return `<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(1, y(0)-y(v))}" rx="${Math.min(4,bw/2)}" fill="${col}"><title>${short(k)}: ${tip}</title></rect>`;
    }).join('');
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs>${grid}${body}${xLabels(keys,x,H)}</svg>`;
}

function levelColor(p, color){
  if (p === null) return '#353a48';
  if (p === 0) return '#3d4252';
  const a = p >= 100 ? 'ff' : p >= 75 ? 'cc' : p >= 50 ? '99' : p >= 25 ? '66' : '40';
  return color + a;
}
function yearMap(rateFn, color, round){
  const t = parseKey(todayKey());
  const start = addDays(t, -((t.getDay()+6)%7) - 52*7); // понеділок 52 тижні тому
  const cell = 13, gap = 3, L = 30, T = 18, weeks = 53;
  let rects = '', months = '', lastM = -1;
  for (let w = 0; w < weeks; w++) {
    for (let d = 0; d < 7; d++) {
      const day = addDays(start, w*7+d); if (day > t) continue;
      const k = dkey(day), p = rateFn(k);
      rects += `<rect x="${L + w*(cell+gap)}" y="${T + d*(cell+gap)}" width="${cell}" height="${cell}" rx="${round ? cell/2 : 3}" fill="${levelColor(p, color)}"><title>${short(k)}.${day.getFullYear()}: ${p === null ? 'немає даних' : Math.round(p)+'%'}</title></rect>`;
      if (d === 0 && day.getMonth() !== lastM && day.getDate() <= 7) { lastM = day.getMonth(); months += `<text x="${L + w*(cell+gap)}" y="11" fill="#9aa0b0" font-size="11">${MON[lastM]}</text>`; }
    }
  }
  const labels = [0,2,4].map(d => `<text x="0" y="${T + d*(cell+gap) + 10}" fill="#9aa0b0" font-size="10.5">${DOW[d]}</text>`).join('');
  const W = L + weeks*(cell+gap), H = T + 7*(cell+gap);
  return `<div class="year"><svg viewBox="0 0 ${W} ${H}" style="min-width:${W}px;width:100%">${months}${labels}${rects}</svg></div>
    <div class="legend">Менше ${[null,0,20,50,75,100].map(p => `<i style="background:${levelColor(p,color)}"></i>`).join('')} Більше</div>`;
}

function ring(p, color){
  const r = 15, c = 2*Math.PI*r, v = p ?? 0;
  return `<svg class="ring" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="${r}" fill="none" stroke="#3a3f4e" stroke-width="4"/>
    ${v > 0 ? `<circle cx="20" cy="20" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 20 20)"/>` : ''}
    <text x="20" y="24" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e8eaf0">${p === null ? '–' : p+'%'}</text></svg>`;
}



/* ---------- інтервали (челенджі) ---------- */
const GMODES = {
  streak:{label:'Безперервно', hint:'N днів поспіль, пропуск обнуляє лічильник'},
  total:{label:'За сумою днів', hint:'набрати N успішних днів, пропуски не обнуляють'}
};
const parsePlan = t => { const a = String(t || '').split(/[^0-9]+/).map(Number).filter(n => n > 0); return a.length ? a : [7,21,21]; };
function goalInfo(h){
  const g = h.goal; if (!g) return null;
  const N = g.plan[g.stage], t = todayKey();
  let cnt = 0, cur = 0, resets = 0, doneAt = null;
  for (const k of rangeKeys(g.start, t)) {
    const ok = P(h,k) >= thr();
    if (g.mode === 'total') { if (ok && ++cnt >= N) { doneAt = k; break; } }
    else if (ok) { if (++cur >= N) { doneAt = k; break; } }
    else if (k < t && isDue(h,k) && !isWeekly(h)) { if (cur > 0) resets++; cur = 0; }
  }
  const progress = Math.min(N, g.mode === 'total' ? cnt : cur);
  const left = N - progress;
  const from = P(h,t) >= thr() ? addDays(parseKey(t),1) : parseKey(t);
  let eta = null;
  if (!doneAt) for (let d = from, n = 0, i = 0; i < 3660; i++, d = addDays(d,1)) if ((isWeekly(h) || isDue(h,dkey(d))) && ++n >= left) { eta = dkey(d); break; }
  return {g, N, progress, left, doneAt, resets, eta, last: g.stage >= g.plan.length-1};
}
function goalBadge(h){
  const gi = goalInfo(h); if (!gi) return '';
  return gi.doneAt ? `🎯 ${gi.N}/${gi.N} ✓` : `🎯 ${gi.progress}/${gi.N}`;
}
function continueGoal(h, n){
  const gi = goalInfo(h); if (!gi || !gi.doneAt) return;
  const g = h.goal;
  g.history = g.history || [];
  g.history.push({days:gi.N, mode:g.mode, start:g.start, end:gi.doneAt});
  if (n) { if (gi.last) g.plan.push(n); else g.plan[g.stage+1] = n; }
  else if (gi.last) g.plan.push(g.plan[g.stage]);
  g.stage++;
  g.start = dkey(addDays(parseKey(gi.doneAt), 1));
  save(); render(); toast(`Новий етап: ${g.plan[g.stage]} днів`);
}
function goalPanel(h){
  const gi = goalInfo(h);
  if (!gi) return `<div class="panel goal"><div class="row"><h3>🎯 Інтервал</h3><div class="spacer"></div><button class="btn" data-edit="${h.id}">Налаштувати</button></div>
    <div class="hint" style="margin:6px 0 0">Інтервалу немає. Можна поставити етапи, наприклад 7 → 21 → 21 день, безперервно або за сумою днів.</div></div>`;
  const g = gi.g;
  const stages = g.plan.map((n,i) => `<span class="stage ${i < g.stage ? 'done' : i === g.stage ? 'cur' : ''}" style="${i === g.stage ? 'border-color:' + h.color : ''}">${i < g.stage ? '✓ ' : ''}${n} дн.</span>`).join('<span class="arrow">→</span>');
  const boxes = gi.N <= 60 ? `<div class="gboxes">${Array.from({length:gi.N}, (_,i) => `<i style="${i < gi.progress ? 'background:' + h.color : ''}"></i>`).join('')}</div>` : '';
  const pctDone = Math.round(gi.progress / gi.N * 100);
  let status;
  if (gi.doneAt) {
    status = `<div class="gdone">🎉 Етап ${gi.N} днів виконано ${short(gi.doneAt)}${gi.last ? ' — це був останній етап плану, звичку закріплено!' : ''}</div>
      <div class="row" style="margin-top:8px">
        ${gi.last ? '' : `<button class="btn primary" data-gnext="1">Продовжити → ${g.plan[g.stage+1]} днів</button>`}
        <span class="hint" style="margin:0">${gi.last ? 'Продовжити ще на' : 'або свій інтервал:'}</span>
        <input class="inp" id="gCustom" type="number" min="1" style="width:80px" placeholder="${gi.last ? 21 : g.plan[g.stage+1]}"><button class="btn" data-gcustom="1">${gi.last ? 'Продовжити' : 'OK'}</button>
      </div>`;
  } else {
    const resetTxt = g.mode === 'streak' && gi.resets ? ` · серія обривалася ${gi.resets} раз(и), рахуємо від останнього пропуску` : '';
    status = `<div class="hint" style="margin:6px 0 0">Ще ${gi.left} дн. Якщо не пропускати, етап завершиться ${short(gi.eta)}${resetTxt}.</div>`;
  }
  const hist = (g.history || []).length ? `<div class="ghist">${g.history.map(x => `<span>✓ ${x.days} дн. (${GMODES[x.mode] ? GMODES[x.mode].label.toLowerCase() : ''}): ${short(x.start)} – ${short(x.end)}</span>`).join('')}</div>` : '';
  return `<div class="panel goal">
    <div class="row"><h3>🎯 Інтервал · ${GMODES[g.mode].label}</h3><span class="hint" style="margin:0">${GMODES[g.mode].hint}</span><div class="spacer"></div><span class="hint" style="margin:0">етап ${g.stage+1} з ${g.plan.length}</span></div>
    <div class="stages">${stages}</div>
    <div class="row" style="align-items:baseline"><div class="big" style="color:${h.color}">${gi.progress} / ${gi.N}</div><span class="cap">днів · ${pctDone}% етапу · старт ${short(g.start)}</span></div>
    <div class="bar" style="margin:8px 0"><i style="width:${pctDone}%;background:${h.color}"></i></div>
    ${boxes}${status}${hist}
    <div class="row" style="margin-top:10px"><button class="btn plain" data-grestart="1">↺ Почати етап заново з сьогодні</button><button class="btn plain" data-edit="${h.id}">⚙ Змінити етапи</button><button class="btn plain" data-goff="1">Вимкнути інтервал</button></div>
  </div>`;
}

/* ---------- сторінка звички ---------- */
function openDetail(id){
  if (view !== 'habit') prevView = view;
  view = 'habit'; detailId = id; curDate = parseKey(todayKey());
  const t = parseKey(todayKey()); calMonth = new Date(t.getFullYear(), t.getMonth(), 1);
  noteForm = false; closePop(); render();
}
function barChart(labels, vals, max, color, o = {}){
  const W = 560, H = 230, L = 40, R = 8, T = 18, B = 24, n = vals.length, iw = W-L-R;
  const bw = Math.min(34, iw/n*0.62), x = i => L + (i+0.5)*iw/n, y = v => T + (1 - v/max)*(H-T-B);
  const gl = (o.grid || [0, max/2, max]).map(g => `<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="#454a5a" stroke-dasharray="3 4"/><text x="${L-6}" y="${y(g)+4}" fill="#9aa0b0" font-size="10.5" text-anchor="end">${o.yfmt ? o.yfmt(g) : g}</text>`).join('');
  const step = n <= 14 ? 1 : Math.max(1, Math.ceil(n/10));
  const bars = vals.map((v,i) => v === null ? '' : `<rect x="${x(i)-bw/2}" y="${y(Math.min(v,max))}" width="${bw}" height="${Math.max(2, y(0)-y(Math.min(v,max)))}" rx="${Math.min(5,bw/2)}" fill="${color}" opacity="${o.target && v < o.target ? .55 : 1}"><title>${labels[i]}: ${o.tip ? o.tip(v) : v}</title></rect>${n <= 14 ? `<text x="${x(i)}" y="${y(Math.min(v,max))-5}" fill="#cfd3dc" font-size="10.5" text-anchor="middle">${o.vfmt ? o.vfmt(v) : v}</text>` : ''}`).join('');
  const xl = labels.map((l,i) => i % step === 0 || i === n-1 ? `<text x="${x(i)}" y="${H-6}" fill="#9aa0b0" font-size="10.5" text-anchor="middle">${l}</text>` : '').join('');
  const tl = o.target ? `<line x1="${L}" x2="${W-R}" y1="${y(o.target)}" y2="${y(o.target)}" stroke="#f5a524" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${L+4}" y="${y(o.target)-5}" fill="#f5a524" font-size="10.5" text-anchor="start">ціль ${o.vfmt ? o.vfmt(o.target) : o.target}</text>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${gl}${bars}${tl}${xl}</svg>`;
}
function renderHabit(){
  const h = state.habits.find(x => x.id === detailId);
  if (!h) { view = prevView; return render(); }
  const t = todayKey(), T = TYPES[h.type] || TYPES.good;
  const all = scored(h, rangeKeys(startOf(h), lastDay(h)));
  const full = all.filter(p => p >= 100).length, part = all.filter(p => p > 0 && p < 100).length, miss = all.length - full - part;
  const r30 = habitRate(h, periodKeys(30));
  const e = entry(t,h.id), p = pct(h,t);
  let todayTxt = 'Сьогодні ще не відмічено';
  if (e) {
    const val = h.measure === 'number' ? `${fmt(e.v)} ${esc(h.unit||'')} · ${p}%` : h.measure === 'rating' ? `${e.v} / 5 · ${LABELS[e.v]}` : (e.v ? 'виконано' : 'не виконано');
    todayTxt = `Сьогодні: ${val}${e.t ? ' · о ' + new Date(e.t).toLocaleTimeString('uk-UA',{hour:'2-digit', minute:'2-digit'}) : ''}`;
  }
  const mLine = [schedText(h) + (isWeekly(h) && !finished(h) ? ` (цього тижня ${weekDone(h,t)}/${h.sched.n})` : ''), h.measure === 'number' ? targetText(h) : MEASURES[h.measure].label, endText(h)].filter(Boolean).join(' · ');

  // календар
  const y0 = calMonth.getFullYear(), m0 = calMonth.getMonth();
  const first = new Date(y0, m0, 1), days = new Date(y0, m0+1, 0).getDate(), lead = (first.getDay()+6) % 7;
  let cal = DOW.map(d => `<div class="cdh">${d}</div>`).join('') + '<div></div>'.repeat(lead);
  for (let d = 1; d <= days; d++) {
    const k = dkey(new Date(y0, m0, d)), ee = entry(k,h.id), pp = pctOf(h,ee);
    if (k > t) { cal += `<div class="cd future">${d}</div>`; continue; }
    const bg = ee && pp > 0 ? `background:${levelColor(pp, h.color)};` : '';
    const mark = ee && pp === 0 ? '<i>✗</i>' : '';
    const tip = ee ? (h.measure === 'number' ? fmt(ee.v) + ' ' + (h.unit||'') + ' · ' : '') + pp + '%' : 'немає запису';
    const offDay = !ee && (!inLife(h,k) || (!isWeekly(h) && !isDue(h,k)));
    cal += `<button class="cd ${k === t ? 'today' : ''} ${pp >= 75 ? 'dark' : ''} ${offDay ? 'off' : ''}" style="${bg}" data-cell="${h.id}|${k}" title="${short(k)}: ${esc(tip)}">${d}${mark}</button>`;
  }
  const calTitle = calMonth.toLocaleDateString('uk-UA',{month:'long', year:'numeric'});
  const nextOk = new Date(y0, m0+1, 1) <= parseKey(t);

  // графік
  let chart, head, cap;
  if (detailTab === 'days') {
    const ks = periodKeys(30), labels = ks.map(short);
    if (h.measure === 'number') {
      const vals = ks.map(k => !shown(h,k) ? null : (entry(k,h.id) ? +entry(k,h.id).v : 0));
      const nn = vals.filter(v => v !== null), mx = Math.max(h.target*1.25 || 1, ...nn);
      const a = counted(h, ks).map(k => entry(k,h.id) ? +entry(k,h.id).v : 0);
      head = a.length ? fmt(Math.round(avg(a))) : '—'; cap = `${esc(h.unit||'')} у середньому за день (30 днів)`;
      chart = barChart(labels, vals, mx, h.color, {target: h.dir === 'max' ? null : h.target, grid:[0, Math.round(mx/2), Math.round(mx)], yfmt:compact, vfmt:compact, tip:v => fmt(v) + ' ' + (h.unit||'')});
    } else {
      const vals = ks.map(k => !shown(h,k) ? null : P(h,k));
      head = r30 === null ? '—' : Math.round(r30) + '%'; cap = 'виконання за останні 30 днів';
      chart = barChart(labels, vals, 100, h.color, {grid:[0,50,100], yfmt:v => v + '%', tip:v => v + '%'});
    }
  } else {
    const groups = [];
    if (detailTab === 'weeks') {
      const mon = addDays(parseKey(t), -dow(t));
      for (let i = 11; i >= 0; i--) { const s0 = addDays(mon, -7*i); groups.push([short(dkey(s0)), rangeKeys(dkey(s0), dkey(addDays(s0,6)) < t ? dkey(addDays(s0,6)) : t)]); }
    } else {
      const tt = parseKey(t);
      for (let i = 11; i >= 0; i--) { const s0 = new Date(tt.getFullYear(), tt.getMonth()-i, 1), e0 = new Date(tt.getFullYear(), tt.getMonth()-i+1, 0); groups.push([MON[s0.getMonth()], rangeKeys(dkey(s0), dkey(e0) < t ? dkey(e0) : t)]); }
    }
    const vals = groups.map(([,ks]) => { const r = habitRate(h, ks); return r === null ? null : Math.round(r); });
    const nn = vals.filter(v => v !== null);
    head = nn.length ? Math.round(avg(nn)) + '%' : '—';
    cap = detailTab === 'weeks' ? 'середнє виконання за тиждень (12 тижнів)' : 'середнє виконання за місяць (12 місяців)';
    chart = barChart(groups.map(g => g[0]), vals, 100, h.color, {grid:[0,50,100], yfmt:v => v + '%', vfmt:v => v + '%', tip:v => v + '%'});
  }

  // нотатки
  const notes = (state.notes[h.id] || []).slice().sort((a,b) => b.d.localeCompare(a.d));
  const notesHtml = notes.length ? notes.map(nt => `<div class="noteitem"><div class="nd">${parseKey(nt.d).toLocaleDateString('uk-UA',{day:'numeric', month:'long', year:'numeric'})}</div><div class="nt">${esc(nt.text).replace(/\n/g,'<br>')}</div><button class="kebab" data-delnote="${nt.id}" title="Видалити">×</button></div>`).join('') : (noteForm ? '' : '<div class="hint">Нотаток ще немає. Натисни +, щоб записати, як пройшов день.</div>');

  const tile = (ic, label, val, unit, accent) => `<div class="dtile ${accent ? 'acc' : ''}"><div class="dl">${ic} ${label}</div><div><b style="${accent ? 'color:' + h.color : ''}">${val}</b> <span>${unit}</span></div></div>`;
  $('#main').innerHTML = `<div class="detail">
    <button class="btn plain" data-act="back">← Назад</button>
    <div class="panel dhead" style="background:linear-gradient(120deg, ${h.color}33 0%, var(--card) 45%)">
      <div class="icon big" style="background:${h.color}">${iconHTML(h.icon)}</div>
      <div class="info"><div class="dname">${esc(h.name)}<span class="type ${T.cls}" title="${T.label} звичка">${T.s}</span></div>
        ${h.note ? `<div class="note">${esc(h.note)}</div>` : ''}<div class="sub">${mLine} · ${todayTxt}</div></div>
      ${control(h, t)}
      <button class="btn" data-edit="${h.id}" title="Редагувати">✎</button>
      ${finished(h) ? '' : `<button class="btn" data-finish="${h.id}" title="Завершити звичку">🏁</button>`}
    </div>
    ${finished(h) ? (() => { const fr = habitRate(h, rangeKeys(startOf(h), h.end)); return `<div class="panel fin"><div class="row"><h3>🏁 Звичку завершено ${longDate(h.end)}</h3><div class="spacer"></div><button class="btn primary" data-restore="${h.id}">↺ Відновити</button></div>
      <div class="hint" style="margin:6px 0 0">Період ${fullDate(startOf(h))} – ${fullDate(h.end)} (${daysBetween(startOf(h), h.end)+1} дн.) · виконання ${fr === null ? '—' : Math.round(fr) + '%'} · найкраща серія ${bestStreak(h)} ${sUnit(h)}. Усі записи збережено.</div></div>`; })() : ''}
    ${goalPanel(h)}
    <div class="dtiles">
      ${tile('🔥','Поточна серія', streak(h), sUnit(h), true)}
      ${tile('🏆','Найкраща серія', bestStreak(h), sUnit(h))}
      ${tile('📈','Останні 30 днів', r30 === null ? '—' : Math.round(r30) + '%', 'виконання', true)}
      ${tile('✔️','Повністю', full, 'дн.')}
      ${tile('◐','Частково', part, 'дн.')}
      ${tile('✗','Не виконано', miss, 'дн.')}
    </div>
    <div class="dgrid">
      <div class="panel">
        <div class="row"><button class="btn" data-cal="-1">‹</button><div class="spacer" style="text-align:center;font-weight:700;text-transform:capitalize">${calTitle}</div><button class="btn" data-cal="1" ${nextOk ? '' : 'disabled'}>›</button></div>
        <div class="cal">${cal}</div>
        <div class="hint" style="margin:8px 0 0">Клацни на день, щоб поставити або змінити результат.</div>
      </div>
      <div class="panel">
        <div class="row"><div><div class="big" style="color:${h.color}">${head}</div><div class="cap">${cap}</div></div><div class="spacer"></div>
          <div class="seg soft">${[['days','Дні'],['weeks','Тижні'],['months','Місяці']].map(([k,l]) => `<button class="${detailTab === k ? 'on' : ''}" data-dtab="${k}">${l}</button>`).join('')}</div></div>
        ${chart}
      </div>
    </div>
    <div class="panel"><h3><span class="icon sm" style="background:${h.color}">${iconHTML(h.icon)}</span> Історія</h3>
      ${yearMap(k => shown(h,k) ? P(h,k) : null, h.color, true)}</div>
    <div class="panel">
      <div class="row"><h3>Нотатки</h3><div class="spacer"></div><button class="btn" data-act="noteForm">+</button></div>
      ${noteForm ? `<div class="noteform"><input type="date" class="inp" id="noteDate" value="${t}" max="${t}" style="width:170px"><textarea class="inp" id="noteText" rows="3" placeholder="Як пройшов день, що допомогло, що заважало…"></textarea>
        <div class="row"><div class="spacer"></div><button class="btn" data-act="noteCancel">Скасувати</button><button class="btn primary" data-act="noteSave">Зберегти</button></div></div>` : ''}
      ${notesHtml}
    </div>
  </div>`;
  const nt = $('#noteText'); if (nt) nt.focus();
}

/* ---------- сторінки ---------- */
function render(){
  document.querySelectorAll('.nav').forEach(b => b.classList.toggle('active', b.dataset.view === (view === 'habit' ? prevView : view)));
  const t = todayKey();
  const due = activeHabits().filter(h => dueOn(h,t));
  const done = due.filter(h => entry(t,h.id)).length;
  $('#todayPill').textContent = `${done}/${due.length} сьогодні`;
  const r = due.length ? Math.round(avg(due.map(h => P(h,t)))) : 0;
  $('#pctPill').innerHTML = `<span class="dot"></span>${r}% виконання`;
  ({dashboard:renderDashboard, manage:renderManage, progress:renderProgress, settings:renderSettings, habit:renderHabit})[view]();
  window.scrollTo(0, view === lastView ? window.scrollY : 0); lastView = view;
  if (typeof showUpdPopup === 'function' && updState) showUpdPopup();
}

const modeSeg = () => `<div class="seg soft"><button class="${dashMode() === 'table' ? 'on' : ''}" data-mode="table">▦ Таблиця</button><button class="${dashMode() === 'cards' ? 'on' : ''}" data-mode="cards">☰ Картки</button></div>`;
const dashMode = () => state.settings.dash || 'table';
let TDAYS = 10;
function compact(v){ v = +v; if (v >= 10000) return Math.round(v/1000) + 'k'; if (v >= 1000) return (v/1000).toFixed(1).replace('.0','') + 'k'; return String(Math.round(v*10)/10); }
function renderDashboard(){
  if (dashMode() === 'table') return renderTable();
  const dk = dkey(curDate), isToday = dk === todayKey();
  const label = curDate.toLocaleDateString('uk-UA',{weekday:'long', day:'numeric', month:'long'});
  $('#main').innerHTML = `
    <div class="row">
      <button class="btn" data-act="prev" title="Попередній день">‹</button>
      <div class="date">${isToday ? 'Сьогодні, ' : ''}${label}</div>
      <button class="btn" data-act="next" ${isToday ? 'disabled' : ''} title="Наступний день">›</button>
      ${isToday ? '' : '<button class="btn" data-act="today">До сьогодні</button>'}
      <div class="spacer"></div>
      ${modeSeg()}
      <input class="search" id="search" placeholder="Пошук звичок…" value="${esc(search)}">
    </div>
    ${finishBanner()}
    <div id="daysum"></div>
    <h2>Мої звички</h2>
    <div class="hint">Відмічай, став оцінку або вписуй цифру. Відсоток виконання рахується автоматично. Від ${thr()}% день іде в серію.</div>
    <div id="list"></div>`;
  renderList();
  $('#search').addEventListener('input', e => { search = e.target.value; renderList(); });
}


function renderTable(){
  TDAYS = window.innerWidth < 700 ? 5 : 10;
  const t = parseKey(todayKey());
  const keys = Array.from({length:TDAYS}, (_,i) => dkey(addDays(t, -tableOff - i)));
  const hs = activeHabits().filter(h => (h.name+' '+(h.note||'')).toLowerCase().includes(search.toLowerCase()));
  const head = keys.map(k => { const d = parseKey(k), isT = k === todayKey(); return `<div class="th ${isT ? 'today' : ''}">${pad(d.getDate())}.${pad(d.getMonth()+1)}<br><span>${DOW[dow(k)].toLowerCase()}</span></div>`; }).join('');
  const rows = hs.map(h => {
    const T = TYPES[h.type] || TYPES.good, st = streak(h), r = habitRate(h, periodKeys(30));
    const sub = [h.note, targetText(h), skind(h) !== 'daily' ? schedText(h) + (isWeekly(h) ? ` · ${weekDone(h,todayKey())}/${h.sched.n} цього тижня` : '') : '', endText(h)].filter(Boolean).join(' · ');
    const cells = keys.map(k => {
      const e = entry(k,h.id), p = pctOf(h,e), out = !inLife(h,k), off = !e && !out && (isWeekly(h) || !isDue(h,k));
      let txt, cls = '';
      if (!e) { txt = out ? '' : off ? '·' : '?'; cls = off ? 'q off' : 'q'; }
      else if (h.measure === 'check') { txt = e.v ? '✓' : '✗'; cls = e.v ? 'ok' : 'no'; }
      else if (h.measure === 'rating') txt = e.v;
      else txt = compact(e.v);
      const bg = e && p > 0 && h.measure !== 'check' ? `background:${levelColor(p, h.color)};` : '';
      const fg = e && h.measure === 'check' && e.v ? `color:${h.color};` : (p >= 75 && h.measure !== 'check' ? 'color:#1d1b2e;' : '');
      const tip = `${short(k)}: ${e ? (h.measure === 'number' ? fmt(e.v) + ' ' + (h.unit||'') + ' — ' : '') + p + '%' : 'немає запису'}`;
      return `<button class="td ${cls}" style="${bg}${fg}" data-cell="${h.id}|${k}" title="${esc(tip)}">${txt}</button>`;
    }).join('');
    return `<div class="tr">
      <div class="tname" data-open="${h.id}" title="Відкрити звичку">
        ${ring(r === null ? null : Math.round(r), h.color)}
        <div class="icon" style="background:${h.color}">${iconHTML(h.icon)}</div>
        <div class="info"><div class="title" style="color:${h.color}">${esc(h.name)}<span class="type ${T.cls}">${T.s}</span></div>
        <div class="note">${esc(sub)}${st ? `${sub ? ' · ' : ''}🔥 ${st}${isWeekly(h) ? ' тиж.' : ''}` : ''}${h.goal ? ` · <b class="gb" style="color:${h.color}">${goalBadge(h)}</b>` : ''}</div></div>
      </div>${cells}</div>`;
  }).join('');
  const foot = keys.map(k => { const r = dayRate(k, state.habits); return `<div class="tf">${r === null ? '' : Math.round(r) + '%'}</div>`; }).join('');
  $('#main').innerHTML = `
    <div class="row">
      <h2 style="margin:0">Мої звички</h2>
      <div class="spacer"></div>
      ${modeSeg()}
      <input class="search" id="search" placeholder="Пошук звичок…" value="${esc(search)}">
    </div>
    <div class="hint" style="margin-top:6px">Клацни на клітинку, щоб поставити результат за будь-який день. ✓ / ✗ / ? для відміток, цифра або оцінка — для решти, · — день не за розкладом. Кільце зліва — виконання за 30 днів.</div>
    ${finishBanner()}
    ${activeHabits().length ? `<div class="ttable" style="--n:${TDAYS}">
      <div class="tr thead"><div class="tnav"><button class="btn" data-shift="${TDAYS}" title="Раніше">‹ раніше</button>
        <button class="btn" data-shift="-${TDAYS}" ${tableOff === 0 ? 'disabled' : ''} title="Пізніше">пізніше ›</button>
        ${tableOff ? '<button class="btn" data-shift="reset">Сьогодні</button>' : ''}</div>${head}</div>
      ${rows || '<div class="empty">Нічого не знайдено</div>'}
      <div class="tr tfoot"><div class="tname muted">Виконання за день</div>${foot}</div>
    </div>` : `<div class="empty">${state.habits.length ? 'Активних звичок немає, усі в «Завершених».' : 'Звичок ще немає.'} <button class="btn primary" data-act="new">+ Додати звичку</button></div>`}`;
  $('#search').addEventListener('input', e => { search = e.target.value; const pos = e.target.selectionStart; renderTable(); const si = $('#search'); si.focus(); si.setSelectionRange(pos,pos); });
}

/* спливаюче вікно для введення за дату */
let pop = null;
function openPop(btn, id, k){
  const h = state.habits.find(x => x.id === id); if (!h) return;
  pop = {id, k};
  const e = entry(k,id), d = parseKey(k);
  const title = `${esc(h.name)} · ${d.toLocaleDateString('uk-UA',{weekday:'short', day:'numeric', month:'short'})}`;
  let body;
  if (h.measure === 'rating') body = `<div class="rate">${[1,2,3,4,5].map(n => `<button data-prate="${n}" class="${e && n < e.v ? 'fill' : ''} ${e && n === e.v ? 'on' : ''}" title="${LABELS[n]}">${n}</button>`).join('')}</div>`;
  else body = `<div class="numbox"><input class="numinp" id="popNum" type="number" min="0" step="any" value="${e ? e.v : ''}" placeholder="0"><span>/ ${fmt(h.target||0)} ${esc(h.unit||'')}</span><button class="btn primary" data-pok="1">OK</button></div>`;
  const el = $('#pop');
  el.innerHTML = `<div class="ptitle">${title}</div>${body}${e ? '<button class="btn plain" data-pclear="1">Очистити</button>' : ''}`;
  el.classList.remove('hidden');
  const r = btn.getBoundingClientRect(), w = el.offsetWidth;
  el.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width/2 - w/2)) + 'px';
  el.style.top = (r.bottom + 6 + window.scrollY) + 'px';
  const ni = $('#popNum'); if (ni) { ni.focus(); ni.select(); }
}

function control(h, dk){
  const e = entry(dk,h.id);
  if (h.measure === 'check') return `<button class="done ${e && e.v ? 'on' : ''}" data-check="${h.id}">${e && e.v ? '✓ Виконано' : '✓ Готово'}</button>`;
  if (h.measure === 'rating') { const v = e ? e.v : 0; return `<div class="rate">${[1,2,3,4,5].map(n => `<button data-rate="${n}" data-id="${h.id}" class="${n < v ? 'fill' : ''} ${n === v ? 'on' : ''}" title="${n} — ${LABELS[n]}">${n}</button>`).join('')}</div>`; }
  return `<div class="numbox"><input class="numinp" type="number" min="0" step="any" data-num="${h.id}" value="${e ? e.v : ''}" placeholder="0"><span>/ ${fmt(h.target||0)} ${esc(h.unit||'')}</span></div>`;
}
function targetText(h){
  if (h.measure !== 'number') return '';
  return `${h.dir === 'max' ? 'не більше' : 'min'} ${fmt(h.target||0)} ${esc(h.unit||'')}`;
}
function renderList(){
  const dk = dkey(curDate), yk = dkey(addDays(curDate,-1));
  const hs = state.habits.filter(h => !finished(h) || (h.end >= dk && startOf(h) <= dk && !h.closed));
  const due = hs.filter(h => dueOn(h,dk));
  if (due.length) {
    const r = Math.round(avg(due.map(h => P(h,dk))));
    const c = due.filter(h => entry(dk,h.id)).length;
    $('#daysum').innerHTML = `<div class="daysum"><b>${r}%</b><span class="note">виконання за день · відмічено ${c} з ${due.length}</span><div class="bar"><i style="width:${r}%"></i></div></div>`;
  } else $('#daysum').innerHTML = '';
  const list = hs.filter(h => (h.name+' '+(h.note||'')).toLowerCase().includes(search.toLowerCase()));
  if (!hs.length) { $('#list').innerHTML = `<div class="empty">Звичок ще немає. <button class="btn primary" data-act="new">+ Додати звичку</button></div>`; return; }
  if (!list.length) { $('#list').innerHTML = `<div class="empty">Нічого не знайдено</div>`; return; }
  $('#list').innerHTML = list.map(h => {
    const p = pct(h,dk), T = TYPES[h.type] || TYPES.good, st = streak(h);
    let risk = '';
    if (!entry(dk,h.id) && inLife(h,dk)) {
      if (isWeekly(h)) { const need = h.sched.n - weekDone(h,dk), left = 7 - dow(dk); if (need > 0 && left <= need) risk = `⚠ Ще ${need} р. до кінця тижня`; }
      else if (isDue(h,dk)) { let d = addDays(curDate,-1); for (let i = 0; i < 60 && !isDue(h,dkey(d)); i++) d = addDays(d,-1); const pk = dkey(d); if (pk >= startOf(h) && !entry(pk,h.id)) risk = '⚠ Не пропускай двічі'; }
    }
    const offToday = !isWeekly(h) && !isDue(h,dk) && !entry(dk,h.id);
    const note = [h.note, targetText(h), skind(h) !== 'daily' ? schedText(h) : '', endText(h)].filter(Boolean).join(' · ');
    let state_ = 'Не відмічено';
    if (p !== null) state_ = h.measure === 'rating' ? `<b>${entry(dk,h.id).v} / 5</b> · ${LABELS[entry(dk,h.id).v]}` : `<b>${p}%</b> виконано`;
    return `<div class="card">
      <div class="icon clickable" data-open="${h.id}" style="background:${h.color}">${iconHTML(h.icon)}</div>
      <div class="info">
        <div><span class="title clickable" data-open="${h.id}">${esc(h.name)}</span>${note ? ` <span class="note">· ${note}</span>` : ''}<span class="type ${T.cls}" title="${T.label} звичка">${T.s}</span></div>
        <div class="sub">${offToday ? 'За розкладом сьогодні вихідний' : state_}${isWeekly(h) ? ` · ${weekDone(h,dk)}/${h.sched.n} цього тижня` : ''}${st ? ` · 🔥 ${st} ${sUnit(h)} поспіль` : ''}${h.goal ? ` · <b style="color:${h.color}">${goalBadge(h)}</b>` : ''}${risk ? ` · <span class="warn">${risk}</span>` : ''}</div>
        <div class="mini"><i style="width:${p ?? 0}%;background:${h.color}"></i></div>
      </div>
      ${control(h, dk)}
      ${ring(p, h.color)}
      <button class="kebab" data-edit="${h.id}" title="Редагувати">⋮</button>
    </div>`;
  }).join('');
}

function renderProgress(){
  const hs = selHabits();
  const keys = periodKeys(period);
  const pLabel = {7:'Останні 7 днів', 30:'Останні 30 днів', 90:'Останні 90 днів', 365:'Останній рік', all:'За весь час'}[period];
  const rates = keys.map(k => dayRate(k,hs)).filter(v => v !== null);
  const avgRate = rates.length ? Math.round(avg(rates)) : null;
  const statuses = keys.map(k => dayStatus(k,hs)).filter(Boolean);
  const perfect = statuses.filter(s => s === 'perfect').length, partial = statuses.filter(s => s === 'partial').length, missed = statuses.filter(s => s === 'missed').length;
  const ps = perfectStreaks(hs);
  let checkins = 0, scheduled = 0;
  keys.forEach(k => { const l = dayHabits(k,hs); scheduled += l.length; checkins += l.filter(h => entry(k,h.id)).length; });
  const bigVal = chartTab === 'rate' ? (avgRate === null ? '—' : avgRate + '%') : chartTab === 'checkins' ? checkins : perfect;
  const bigCap = chartTab === 'rate' ? 'середнє виконання запланованого' : chartTab === 'checkins' ? `відміток із ${scheduled} запланованих` : 'ідеальних днів (усе на 100%)';

  // тижневий ритм
  const byDow = DOW.map((_,i) => { const v = keys.filter(k => dow(k) === i).map(k => dayRate(k,hs)).filter(v => v !== null); return v.length ? Math.round(avg(v)) : null; });
  // час відміток
  const hours = Array(24).fill(0); let tcount = 0;
  keys.forEach(k => hs.forEach(h => { const e = entry(k,h.id); if (e && e.t) { hours[new Date(e.t).getHours()]++; tcount++; } }));
  const hmax = Math.max(1, ...hours);

    ${[0,6,12,18,24].map(h => `<text x="${Math.min(296, h*12.5+2)}" y="106" fill="#9aa0b0" font-size="9.5" text-anchor="${h === 24 ? 'end' : 'start'}">${pad(h % 24)}:00</text>`).join('')}</svg>`;

  // тижневий огляд
  const mon = addDays(parseKey(todayKey()), -dow(todayKey()) + weekOff*7);
  const wkeys = [0,1,2,3,4,5,6].map(i => dkey(addDays(mon,i)));
  const wLabel = weekOff === 0 ? 'Цей тиждень' : weekOff === -1 ? 'Минулий тиждень' : `${-weekOff} тиж. тому`;
  const review = hs.map(h => {
    const vals = wkeys.map(k => (k > todayKey() || k < startOf(h)) ? null : (k === todayKey() && !entry(k,h.id) ? null : P(h,k)));
    const v = vals.filter(x => x !== null);
    return `<div class="nm"><div class="icon" style="background:${h.color}">${iconHTML(h.icon)}</div>${esc(h.name)}</div>
      ${vals.map(p => `<div class="c" style="background:${levelColor(p,h.color)};color:${p >= 75 ? '#1d1b2e' : '#e8eaf0'}">${p === null ? '' : p+'%'}</div>`).join('')}
      <div class="c" style="background:none">${v.length ? Math.round(avg(v))+'%' : '—'}</div>`;
  }).join('');

  // таблиця звичок
  const prevKeys = period === 'all' ? [] : rangeKeys(dkey(addDays(parseKey(keys[0]), -keys.length)), dkey(addDays(parseKey(keys[0]), -1)));
  let rows = hs.map(h => {
    const r = habitRate(h,keys), pr = prevKeys.length ? habitRate(h,prevKeys) : null;
    return {h, r, trend: (r !== null && pr !== null) ? Math.round(r - pr) : null, cur:streak(h), best:bestStreak(h), done:keys.filter(k => entry(k,h.id)).length};
  });
  const sorters = {rate:(a,b) => (b.r ?? -1) - (a.r ?? -1), streak:(a,b) => b.cur - a.cur || b.best - a.best, done:(a,b) => b.done - a.done, name:(a,b) => a.h.name.localeCompare(b.h.name, 'uk')};
  rows.sort(sorters[sortBy]);

  $('#main').innerHTML = `
    <div class="row" style="margin-bottom:14px">
      <div><h1>Прогрес</h1><div class="hint" style="margin:2px 0 0">${pLabel}</div></div>
      <div class="spacer"></div>
      <select class="sel-in" id="filter"><option value="all">Усі звички</option>${state.habits.map(h => `<option value="${h.id}" ${filter === h.id ? 'selected' : ''}>${esc(h.name)}${finished(h) ? ' (завершена)' : ''}</option>`).join('')}</select>
      <div class="seg">${[[7,'7Д'],[30,'30Д'],[90,'90Д'],[365,'1Р'],['all','Усе']].map(([p,l]) => `<button class="${p === period ? 'on' : ''}" data-period="${p}">${l}</button>`).join('')}</div>
    </div>

    <div class="panel hero">
      <div class="row"><div><div class="big">${bigVal}</div><div class="cap">${bigCap}</div></div><div class="spacer"></div>
        <div class="seg soft">${[['rate','Виконання'],['checkins','Відмітки'],['perfect','Ідеальні дні']].map(([t,l]) => `<button class="${chartTab === t ? 'on' : ''}" data-tab="${t}">${l}</button>`).join('')}</div></div>
      ${bigChart(keys, hs)}
    </div>

    <div class="tiles">
      <div class="tile"><div class="ti" style="background:#1f3b2b">🌲</div><div><b>${perfect}</b><div class="l">ідеальних днів</div><div class="s">${perfect ? 'усе виконано на 100%' : 'ще жодного'}</div></div></div>
      <div class="tile"><div class="ti" style="background:#45301f">🔥</div><div><b>${ps.cur} дн.</b><div class="l">ідеальна серія</div><div class="s">рекорд: ${ps.best}</div></div></div>
      <div class="tile"><div class="ti" style="background:#3a3352">✔️</div><div><b>${checkins}</b><div class="l">відміток</div><div class="s">із ${scheduled} запланованих</div></div></div>
      <div class="tile"><div class="ti" style="background:#352e4a">📉</div><div><b>${missed}</b><div class="l">пропущених днів</div><div class="s">${partial} частково виконано</div></div></div>
    </div>

    <div class="three">
      <div class="panel"><h3>Тижневий ритм</h3><div class="cap">Середнє виконання за днями тижня</div>
        <div class="wk">${DOW.map((d,i) => `<div><span class="val">${byDow[i] === null ? '–' : byDow[i]+'%'}</span><span class="track"><i style="height:${byDow[i] ?? 0}%"></i></span><span class="d">${d}</span></div>`).join('')}</div></div>
      <div class="panel"><h3>Розподіл днів</h3><div class="cap">Чим закінчився кожен день</div>
        <div class="stack">${statuses.length ? `<i style="width:${perfect/statuses.length*100}%;background:var(--perfect)"></i><i style="width:${partial/statuses.length*100}%;background:var(--partial)"></i><i style="width:${missed/statuses.length*100}%;background:var(--missed)"></i>` : ''}</div>
        <div class="legrow"><span class="sq" style="background:var(--perfect)"></span>Ідеальні<b>${perfect}</b></div>
        <div class="legrow"><span class="sq" style="background:var(--partial)"></span>Частково<b>${partial}</b></div>
        <div class="legrow"><span class="sq" style="background:var(--missed)"></span>Пропущені<b>${missed}</b></div></div>
      <div class="panel"><h3>Час доби</h3><div class="cap">Коли ти робиш відмітки</div>
        ${tcount < 3 ? '<div class="hint">Зроби кілька відміток, щоб побачити, коли ти виконуєш звички.</div>' : ''}${timeSvg}</div>
    </div>

    <div class="panel">
      <div class="row"><h3>📅 Огляд тижня</h3><div class="spacer"></div>
        <button class="btn" data-week="-1">‹</button>
        <div style="text-align:center;min-width:120px"><div class="hint" style="margin:0;text-transform:uppercase;font-size:10.5px">${wLabel}</div><b>${short(wkeys[0])} – ${short(wkeys[6])}</b></div>
        <button class="btn" data-week="1" ${weekOff >= 0 ? 'disabled' : ''}>›</button></div>
      <div class="review" style="margin-top:12px"><div></div>${wkeys.map((k,i) => `<div class="h">${DOW[i]}<br>${short(k)}</div>`).join('')}<div class="h">Середнє</div>${review}</div>
    </div>

    <div class="panel"><h3>Останній рік</h3><div class="cap">Кожна клітинка — день, колір показує відсоток виконання</div>
      ${yearMap(k => dayRate(k,hs), '#a78bfa')}</div>

    <div class="panel htable"><h3>Звички</h3><div class="cap">Клацни на звичку, щоб побачити її рік</div>
      <div class="row" style="margin-bottom:8px"><span class="hint" style="margin:0">Сортувати:</span>
        <div class="seg soft">${[['rate','Виконання'],['streak','Серія'],['done','Відмітки'],['name','Назва']].map(([s,l]) => `<button class="${sortBy === s ? 'on' : ''}" data-sort="${s}">${l}</button>`).join('')}</div></div>
      <div class="hr head"><div>Звичка</div><div>Виконання за період</div><div>Тренд</div><div>Серія</div><div>Відміток</div><div></div></div>
      ${rows.map(o => `<div class="hr" data-expand="${o.h.id}">
        <div class="hname"><div class="icon" style="background:${o.h.color}">${iconHTML(o.h.icon)}</div>${esc(o.h.name)}</div>
        <div class="rbar"><div class="bar"><i style="width:${o.r ?? 0}%;background:${o.h.color}"></i></div><b style="width:42px;text-align:right">${o.r === null ? '—' : Math.round(o.r)+'%'}</b></div>
        <div>${o.trend === null ? '<span class="hint">—</span>' : o.trend > 0 ? `<span class="up">▲ ${o.trend}%</span>` : o.trend < 0 ? `<span class="down">▼ ${-o.trend}%</span>` : '<span class="hint">= 0%</span>'}</div>
        <div>🔥 ${o.cur} &nbsp;🏆 ${o.best}</div>

let draft = null, iconCat = 0;
function openHabit(id){
  const h = state.habits.find(x => x.id === id);
  draft = h ? JSON.parse(JSON.stringify(h)) : {id:uid(), name:'', note:'', icon:'fa:star', color:COLORS[0], type:'good', measure:'check', target:'', unit:'', dir:'min', created:todayKey(), isNew:true};
  draft.gmode = draft.goal ? draft.goal.mode : 'none';
  draft.gplan = draft.goal ? draft.goal.plan.join(', ') : '7, 21, 21';
  draft.gstart = draft.goal ? draft.goal.start : todayKey();
  const sc = draft.sched || {kind:'daily'};
  draft.skind = sc.kind; draft.sdays = sc.days ? sc.days.slice() : [0,2,4];
  draft.sn = sc.n || (sc.kind === 'every' ? 2 : 3); draft.sfrom = sc.from || todayKey(); draft.end = draft.end || '';
  iconCat = Math.max(0, ICON_CATS.findIndex(([,l]) => l.includes((draft.icon||'').slice(3))));

}
function drawModal(){

function keepInputs(){
  if (!draft || !$('#fName')) return;

  if ($('#fTarget')) { draft.target = $('#fTarget').value; draft.unit = $('#fUnit').value; }
  if ($('#fSchedN')) draft.sn = $('#fSchedN').value;
  if ($('#fSchedFrom')) draft.sfrom = $('#fSchedFrom').value || todayKey();
  if ($('#fEnd')) draft.end = $('#fEnd').value;
  if ($('#fPlan')) { draft.gplan = $('#fPlan').value; draft.gstart = $('#fGStart').value || todayKey(); }
  const ci = $('#fIcon').value.trim(); if (ci) draft.icon = ci;
}
function closeModal(){ $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; draft = null; }
function saveHabit(){
  keepInputs();
  if (!draft.name.trim()) { toast('Вкажи назву звички'); return; }
  if (draft.measure === 'number' && (draft.target === '' || isNaN(+draft.target) || +draft.target < 0)) { toast('Вкажи ціль числом'); return; }
  const {isNew, gmode, gplan, gstart, skind: sk, sdays, sn, sfrom, ...h} = draft;
  if (sk === 'daily' || (sk === 'days' && sdays.length === 7)) delete h.sched;
  else if (sk === 'days') { if (!sdays.length) { toast('Обери хоча б один день тижня'); return; } h.sched = {kind:'days', days:sdays.slice().sort()}; }
  else {
    const n = parseInt(sn, 10);
    if (!(n >= 1)) { toast('Вкажи, як часто повторювати'); return; }
    h.sched = sk === 'weekly' ? {kind:'weekly', n:Math.min(7, n)} : {kind:'every', n:Math.max(2, Math.min(365, n)), from:sfrom || todayKey()};
    if (sk === 'weekly' && n >= 7) delete h.sched;
  }
  if (!h.end) delete h.end;
  else if (h.end < h.created) { toast('Кінцева дата раніше за початок звички'); return; }
  const wasFin = !isNew && finished(state.habits.find(x => x.id === h.id) || {});
  if (h.closed && (!h.end || h.end > todayKey())) delete h.closed;
  if (gmode === 'none') delete h.goal;
  else {
    const plan = parsePlan(gplan), old = h.goal;
    if (old) {
      const st = Math.min(old.stage, plan.length-1);
      h.goal = {...old, mode:gmode, plan:plan, stage:st, start:gstart};
    } else h.goal = {mode:gmode, plan, stage:0, start:gstart, history:[]};
  }
  h.name = h.name.trim(); h.note = (h.note || '').trim();
  if (h.measure === 'number') { h.target = +h.target; h.unit = (h.unit || '').trim(); } else { delete h.target; delete h.unit; delete h.dir; }
  const i = state.habits.findIndex(x => x.id === h.id);
  if (i >= 0 && state.habits[i].measure !== h.measure && Object.values(state.entries).some(d => d[h.id])) {
    if (!confirm('Спосіб відмітки змінився. Старі записи цієї звички буде видалено, бо їх не можна перерахувати. Продовжити?')) return;
    for (const k in state.entries) { delete state.entries[k][h.id]; if (!Object.keys(state.entries[k]).length) delete state.entries[k]; }
  }
  if (i >= 0) state.habits[i] = h; else state.habits.push(h);
  save(); closeModal(); render(); toast(finished(h) && !wasFin ? 'Звичку перенесено в «Завершені» 🏁' : isNew ? 'Звичку додано' : 'Збережено');
}
function finishHabit(id){
  const h = state.habits.find(x => x.id === id); if (!h) return;
  if (!confirm(`Завершити звичку «${h.name}» сьогодні? Вона перейде в «Завершені». Записи й статистика збережуться, звичку можна буде відновити.`)) return;
  h.end = todayKey(); h.closed = true;
  save(); render(); toast('Звичку завершено 🏁');
}
function restoreHabit(id){
  const h = state.habits.find(x => x.id === id); if (!h) return;
  delete h.closed; if (h.end && h.end <= todayKey()) delete h.end;
  save(); render(); toast('Звичку відновлено');
}

function finishBanner(){

function delHabit(id){
  const h = state.habits.find(x => x.id === id);
  if (!h || !confirm(`Видалити звичку «${h.name}» разом з усіма записами?`)) return;
  state.habits = state.habits.filter(x => x.id !== id);
  for (const k in state.entries) { delete state.entries[k][id]; if (!Object.keys(state.entries[k]).length) delete state.entries[k]; }
  if (filter === id) filter = 'all';
